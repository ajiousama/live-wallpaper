name: Update Matsuyama cinema showtimes
on:
  workflow_dispatch:
  schedule:
    # JST 07:15, 11:15, 15:15, 19:15, 23:15
    - cron: '15 22,2,6,10,14 * * *'
  pull_request:
    paths:
      - 'scripts/update_cinema_showtimes.py'
      - '.github/workflows/update_cinema_showtimes.yml'
permissions:
  contents: write
jobs:
  cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Retrieve and validate three theaters
        run: python scripts/update_cinema_showtimes.py
      - name: Commit only verified data
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- transport/cinema/showtimes.json || test -n "$(git ls-files --others --exclude-standard transport/cinema/showtimes.json)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add transport/cinema/showtimes.json
            git commit -m "Refresh verified cinema showtimes"
            git push
          fi
