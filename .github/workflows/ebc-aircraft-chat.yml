name: EBC aircraft live chat leads
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install keyless chat reader
        run: python -m pip install pytchat
      - name: Read public EBC live chat
        run: python scripts/ebc_live_chat_watch.py
      - name: Save new unverified leads
        run: |
          if git diff --quiet -- data/ebc_aircraft_chat_leads.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ebc_aircraft_chat_leads.json
          git commit -m "Update EBC aircraft chat leads"
          git push
