name: JR Shikoku special train announcements
on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/watch_jr_special_trains.py
      - name: Persist updated candidate list
        run: |
          if git diff --quiet -- data/jr_special_train_watch.json && [ -f data/jr_special_train_watch.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jr_special_train_watch.json
          git commit -m "data: refresh JR Shikoku special train watch [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
