name: Daily special-aircraft advance forecast (Matsuyama)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_special_aircraft_forecast.py"
      - ".github/workflows/update_special_aircraft_forecast.yml"
  schedule:
    # JST 05:12, 06:12, 18:12, 21:12. GitHub scheduled runs may be late.
    - cron: "12 20,21,9,12 * * *"

permissions:
  contents: write

concurrency:
  group: special-aircraft-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parsing dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify tail/flight attribution and date handling
        run: python scripts/update_special_aircraft_forecast.py --self-test
      - name: Verify wallpaper JavaScript syntax
        run: node --check transport/r15-dev/app.js
      - name: Fetch next seven days of published aircraft plans
        run: python scripts/update_special_aircraft_forecast.py
      - name: Publish refreshed forecast for wallpaper
        run: |
          set -e
          # git diff ignores a brand-new untracked data file. Stage first.
          git add data/special_aircraft_forecast.json
          if git diff --cached --quiet -- data/special_aircraft_forecast.json; then
            echo "No forecast update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update Matsuyama special aircraft forecast [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
