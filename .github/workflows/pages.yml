name: Build and deploy live wallpaper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "transport/**"
      - "config/**"
      - "scripts/**"
      - "data/**"
      - "jra/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-wallpaper-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight fetch dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Update transport cache
        run: python scripts/update_transport.py

      - name: Update JRA winners from official results
        run: python scripts/update_jra.py

      - name: Update wallpaper health status
        run: python scripts/update_data.py

      - name: Persist JRA result changes only
        run: |
          if git diff --quiet -- jra/data.json; then
            echo "No new JRA result"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jra/data.json
            git commit -m "data: update JRA winners [skip ci]"
            git push
          fi

      - name: Stamp wallpaper UI version
        shell: bash
        run: |
          BUILD_ID="$(find transport assets config -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
          printf '{"build":"%s"}\n' "$BUILD_ID" > deploy-version.json
          python - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build_id = sys.argv[1]
          marker = "__BUILD_ID__"
          targets = [
              Path("transport/index.html"),
              Path("transport/r15-dev/index.html"),
              Path("transport/r15-dev/departures.html"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"{path}: build marker not found")
              path.write_text(text.replace(marker, build_id), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
