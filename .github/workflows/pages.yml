name: Build and deploy live wallpaper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "transport/**"
      - "config/**"
      - "scripts/**"
      - "data/**"
      - "jra/**"
      - "gamble/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-wallpaper-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight fetch dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Update transport cache
        if: github.event_name != 'push'
        run: python scripts/update_transport.py

      - name: Update JRA winners from official results
        if: github.event_name != 'push'
        run: python scripts/update_jra.py

      - name: Update weekend gamble results
        if: github.event_name != 'push'
        run: python scripts/update_gamble.py

      - name: Update wallpaper health status
        if: github.event_name != 'push'
        run: python scripts/update_data.py

      - name: Verify eight immutable approved airline logo originals
        shell: bash
        run: |
          set -euo pipefail
          # Do not fetch, regenerate, replace or silently restyle these logos.
          # A missing or modified asset must FAIL deployment, never fall back
          # to an externally hosted or text-only substitute.
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          expected = {
              'ana.svg': 'f094ed18d5b06c27c1eab222013295a57579ee7d',
              'jal.png': '29be9bc653fb2f9620166c00f27571e55f2a27cc',
              'ibex.png': 'ea370c058a3ef94ae1f9bb97a2112d2825928e1c',
              'jetstar.svg': 'af2327e0cb3c3019f76fe74649407d1cd8cbc66f',
              'jeju.svg': '9bbf717d0fc0c9e6ccfb07bea8b35c1fc1c150a1',
              'air-busan.svg': '9d19b10577f5fdac0307a64f88bd406b364ef972',
              'asiana.svg': 'b0fe336c87c0bbf98fb61e6204472e9ef6ecf443',
              'eva.svg': '44b644a6646f340686e27798a46472ec48678aa9',
          }
          for name, blob in expected.items():
              p = Path('transport/assets/airlines') / name
              assert p.is_file() and p.stat().st_size > 0, f'Missing approved logo: {p}'
              actual = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
              assert actual == blob, f'Approved airline logo changed: {p} ({actual})'
              data = p.read_bytes()
              if name.endswith('.png'):
                  assert data.startswith(bytes.fromhex('89504e470d0a1a0a')), f'Invalid PNG: {p}'
              else:
                  assert b'<svg' in data[:500], f'Invalid SVG: {p}'
              print(f'LOCKED {name}: {actual} sha256={hashlib.sha256(data).hexdigest()}')
          PY

      - name: Persist live result changes
        if: github.event_name != 'push'
        # Cinema data updater commits on main concurrently; a push race must never
        # prevent the wallpaper from being published.
        continue-on-error: true
        run: |
          if git diff --quiet -- jra/data.json gamble/data.json; then
            echo "No new race result"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jra/data.json gamble/data.json
            git commit -m "data: update live race results [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::warning::Race data push conflicted; deployment will continue"
                break
              fi
              if git push origin HEAD:main; then
                break
              fi
              sleep "$((attempt * 2))"
            done
          fi

      - name: Stamp wallpaper UI version
        shell: bash
        run: |
          BUILD_ID="$(find transport assets config -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
          printf '{"build":"%s"}\n' "$BUILD_ID" > deploy-version.json
          python - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build_id = sys.argv[1]
          marker = "__BUILD_ID__"
          targets = [
              Path("transport/index.html"),
              Path("transport/r15-dev/index.html"),
              Path("transport/r15-dev/departures.html"),
              Path("transport/freewifi/index.html"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"{path}: build marker not found")
              path.write_text(text.replace(marker, build_id), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
