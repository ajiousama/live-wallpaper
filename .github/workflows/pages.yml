name: Build and deploy live wallpaper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "transport/**"
      - "config/**"
      - "scripts/**"
      - "data/**"
      - "jra/**"
      - "gamble/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-wallpaper-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight fetch dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Update transport cache
        run: python scripts/update_transport.py

      - name: Update JRA winners from official results
        run: python scripts/update_jra.py

      - name: Update weekend gamble results
        run: python scripts/update_gamble.py

      - name: Update wallpaper health status
        run: python scripts/update_data.py

      - name: Cache airline logos into Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="transport/assets/airlines"
          mkdir -p "$OUT"
          get_logo() {
            local url="$1"
            local out="$2"
            curl -fL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 60               -A "Mozilla/5.0 GitHub-Actions live-wallpaper"               "$url" -o "$OUT/$out"
            test -s "$OUT/$out"
          }
          get_logo "https://upload.wikimedia.org/wikipedia/commons/8/8d/All_Nippon_Airways_Logo.svg" "ana.svg"
          get_logo "https://www.matsuyama-airport.co.jp/img/logo/JAL.png" "jal.png"
          get_logo "https://newscast.jp/attachments/GGxKzaX071Sa4bUQShUJ.png" "ibex.png"
          get_logo "https://upload.wikimedia.org/wikipedia/commons/8/8f/Jetstar_logo.svg" "jetstar.svg"
          get_logo "https://upload.wikimedia.org/wikipedia/commons/f/f2/Jeju_Air_Logo.svg" "jeju.svg"
          get_logo "https://upload.wikimedia.org/wikipedia/commons/0/01/Air_Busan_logo.svg" "air-busan.svg"
          get_logo "https://upload.wikimedia.org/wikipedia/commons/7/74/Asiana_Airlines.svg" "asiana.svg"
          get_logo "https://upload.wikimedia.org/wikipedia/commons/c/cf/Logo_EVA_Air.svg" "eva.svg"

      - name: Persist live result changes
        run: |
          if git diff --quiet -- jra/data.json gamble/data.json; then
            echo "No new race result"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jra/data.json gamble/data.json
            git commit -m "data: update live race results [skip ci]"
            git push
          fi

      - name: Stamp wallpaper UI version
        shell: bash
        run: |
          BUILD_ID="$(find transport assets config -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
          printf '{"build":"%s"}\n' "$BUILD_ID" > deploy-version.json
          python - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build_id = sys.argv[1]
          marker = "__BUILD_ID__"
          targets = [
              Path("transport/index.html"),
              Path("transport/r15-dev/index.html"),
              Path("transport/r15-dev/departures.html"),
              Path("transport/freewifi/index.html"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"{path}: build marker not found")
              path.write_text(text.replace(marker, build_id), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
