name: Build and deploy live wallpaper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - "transport/**"
      - "config/**"
      - "scripts/**"
      - "data/**"
      - "jra/**"
      - "gamble/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-wallpaper-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight fetch dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Update transport cache
        if: github.event_name != 'push'
        run: python scripts/update_transport.py

      - name: Update JRA winners from official results
        if: github.event_name != 'push'
        run: python scripts/update_jra.py

      - name: Update weekend gamble results
        if: github.event_name != 'push'
        run: python scripts/update_gamble.py

      - name: Update wallpaper health status
        if: github.event_name != 'push'
        run: python scripts/update_data.py

      - name: Restore and permanently pin approved airline logo originals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="transport/assets/airlines"
          mkdir -p "$OUT"
          approved=(ana.svg jal.png ibex.png jetstar.svg jeju.svg air-busan.svg asiana.svg eva.svg)
          missing=0
          for f in "${approved[@]}"; do
            if ! test -s "$OUT/$f"; then missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then
            # This Pages artifact predates the JAL timeout and contains the
            # original eight user-approved images, not remade substitutes.
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            gh run download 38017111842 -R "$GITHUB_REPOSITORY" -n github-pages -D "$tmp"
            test -s "$tmp/artifact.tar" || { echo '::error::Approved logo backup missing'; exit 1; }
            tar -xf "$tmp/artifact.tar" -C "$tmp"
            for f in "${approved[@]}"; do
              src="$tmp/transport/assets/airlines/$f"
              test -s "$src" || { echo "::error::Missing approved original: $f"; exit 1; }
              cp "$src" "$OUT/$f"
            done
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f "$OUT"
            if ! git diff --cached --quiet; then
              git commit -m 'assets: pin approved airline logo originals [skip ci]'
              # Pin originals in main. Future deployments need no external
              # logo service and must not depend on expiring Actions artifacts.
              git push origin HEAD:main || { echo '::error::Unable to persist pinned logos'; exit 1; }
            fi
          fi
          for f in "${approved[@]}"; do
            test -s "$OUT/$f" || { echo "::error::Approved logo missing: $f"; exit 1; }
          done

      - name: Validate pinned airline logos for Pages
        shell: bash
        run: |
          set -euo pipefail
          test -s transport/assets/airlines/jal.png
          test -s transport/assets/airlines/ana.svg
          test -s transport/assets/airlines/ibex.png
          test -s transport/assets/airlines/jetstar.svg
          test -s transport/assets/airlines/jeju.svg
          test -s transport/assets/airlines/air-busan.svg
          test -s transport/assets/airlines/asiana.svg
          test -s transport/assets/airlines/eva.svg
          # Protect exact original bytes; never silently use textual fallback.
          python - <<'PY'
          from pathlib import Path
          png=Path('transport/assets/airlines/jal.png').read_bytes()
          assert png.startswith(b'\x89PNG\r\n\x1a\n') and len(png) >= 4000, 'JAL approved PNG is invalid'
          for name in ('ana.svg','jetstar.svg','jeju.svg','air-busan.svg','asiana.svg','eva.svg'):
              assert b'<svg' in Path('transport/assets/airlines',name).read_bytes()[:500], name
          PY

      - name: Persist live result changes
        if: github.event_name != 'push'
        # Cinema data updater commits on main concurrently; a push race must never
        # prevent the wallpaper from being published.
        continue-on-error: true
        run: |
          if git diff --quiet -- jra/data.json gamble/data.json; then
            echo "No new race result"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add jra/data.json gamble/data.json
            git commit -m "data: update live race results [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::warning::Race data push conflicted; deployment will continue"
                break
              fi
              if git push origin HEAD:main; then
                break
              fi
              sleep "$((attempt * 2))"
            done
          fi

      - name: Stamp wallpaper UI version
        shell: bash
        run: |
          BUILD_ID="$(find transport assets config -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)"
          printf '{"build":"%s"}\n' "$BUILD_ID" > deploy-version.json
          python - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          build_id = sys.argv[1]
          marker = "__BUILD_ID__"
          targets = [
              Path("transport/index.html"),
              Path("transport/r15-dev/index.html"),
              Path("transport/r15-dev/departures.html"),
              Path("transport/freewifi/index.html"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  raise SystemExit(f"{path}: build marker not found")
              path.write_text(text.replace(marker, build_id), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
