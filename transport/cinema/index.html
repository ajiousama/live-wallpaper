<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>愛媛・映画別上映案内｜5館</title>
<style>
:root{color-scheme:dark;font-family:"Yu Gothic","Meiryo",system-ui,sans-serif;--row-h:78px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#f1f8ff}
main{height:100%;padding:clamp(7px,1.25vw,14px);display:flex;flex-direction:column;gap:8px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none;border-bottom:2px solid #d6a660;padding:1px 4px 8px}
h1{font-size:clamp(23px,2.9vw,35px);margin:0;line-height:1.08}
.eyebrow{font-size:12px;color:#aec6d9;letter-spacing:.08em}
.header-right{text-align:right;font-size:14px;color:#c8dded;line-height:1.45}
#date-kind{color:#ffe0a0;font-weight:900;font-size:16px}
#clock{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.board{min-height:0;flex:1;display:flex;flex-direction:column;border:1px solid #426078;background:#102031;border-radius:6px;overflow:hidden}
.board-head,.film-row{display:grid;grid-template-columns:minmax(285px,1.85fr) repeat(3,minmax(0,1fr));column-gap:0;min-width:0}
.board-head{height:43px;flex:none;background:#20394b;border-bottom:2px solid #64829b}
.board-head>div{display:flex;align-items:center;padding:0 12px;font-size:clamp(16px,1.65vw,21px);font-weight:1000;border-right:1px solid #365368;white-space:nowrap}
.board-head>div:last-child{border:0}
.head-film{color:#f5faff}
.head-shigenobu{color:#94efb0}
.head-masaki{color:#ffda89}
.head-kinuyama{color:#85d4ff}
.film-list{flex:1;min-height:0;overflow:hidden}
.film-row{height:var(--row-h);min-height:var(--row-h);border-bottom:1px solid #304b63;align-items:stretch;background:#102132}
.film-row:nth-child(even){background:#152a3c}
.film-title{min-width:0;display:flex;align-items:center;line-height:1.18;padding:6px 12px;font-size:clamp(17px,1.8vw,22px);font-weight:900;overflow:hidden;overflow-wrap:anywhere}
.film-title>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.movie-times{display:flex;align-content:center;align-items:center;flex-wrap:wrap;gap:3px 5px;min-width:0;max-height:var(--row-h);overflow:hidden;padding:6px 7px;border-left:1px solid #29475b}
.showtime{flex:0 0 auto;font-size:clamp(15px,1.43vw,19px);font-weight:950;line-height:1.22;font-variant-numeric:tabular-nums;padding:2px 4px;color:#f8fcff;background:#284357;border:1px solid #53738b;border-radius:3px;white-space:nowrap}
.showtime.blink{animation:flash 1s steps(1,end) infinite}
@keyframes flash{0%,49%{background:#ffe067;color:#25200d;border-color:#ffe067}50%,100%{background:#755218;color:#fff;border-color:#b29050}}
.more{font-size:13px;font-weight:800;color:#bdcede;white-space:nowrap}
.none{font-size:16px;color:#7891a6;font-weight:800}
.empty{padding:26px 16px;text-align:center;font-size:22px;font-weight:800;color:#a8bed0}
.board-foot{flex:none;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#1a3042;border-top:1px solid #365269;padding:5px 12px;font-size:13px;color:#d1e4f5}
#page-info{color:#ffe0a0;font-weight:850;font-variant-numeric:tabular-nums}
.notices,.fees{flex:none;min-width:0}
.section-title{font-size:13px;color:#dbe8f4;font-weight:850;margin-bottom:3px}
.notice-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.notice-bar,.fee-bar{height:38px;min-width:0;overflow:hidden;background:#1a2e42;border:1px solid #3e586e;border-left:4px solid var(--accent);border-radius:3px}
.ticker-track{display:flex;align-items:center;width:max-content;height:100%;will-change:transform}
.ticker-set{display:flex;align-items:center;flex:0 0 auto;white-space:nowrap;height:100%;gap:28px;padding-right:28px}
.ticker-text{font-size:15px;font-weight:750;color:#f1f6fd}
.ticker-dot{color:#d5a967;font-size:17px}
.fee-bar{--accent:#f3ba57;background:#272f3b}
.fee-bar .ticker-text{font-size:16px}
.footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#aac6dc;font-size:12px;white-space:nowrap}
.footer #data-info{overflow:hidden;text-overflow:ellipsis}
@media(max-width:800px){
 :root{--row-h:84px}
 main{padding:6px;gap:5px}header{gap:7px;padding-bottom:4px}
 h1{font-size:19px}.eyebrow{font-size:9px}.header-right{font-size:10px}#date-kind{font-size:11px}#clock{font-size:12px}
 .board-head,.film-row{grid-template-columns:minmax(115px,1.6fr) repeat(3,minmax(0,1fr))}
 .board-head{height:32px}.board-head>div{padding:0 4px;font-size:11px}
 .film-title{font-size:12px;padding:3px 4px}.movie-times{padding:4px 3px;gap:2px}
 .showtime{font-size:11px;padding:2px}.more,.none{font-size:10px}
 .notice-bar{height:30px}.fee-bar{height:30px}.ticker-text,.fee-bar .ticker-text{font-size:11px}
 .section-title,.board-foot,.footer{font-size:10px}
}
@media(prefers-reduced-motion:reduce){.showtime.blink{animation:none;color:#ffe067}}

/* Compact two-line cinema rows, matching the JR departure-board rhythm. */
/* Use a slower ticker so viewers can read the time followed by the cinema. */
@media(prefers-reduced-motion:reduce){.film-session.blink{animation:none}}

:root{--row-h:54px}
.board-head{height:28px;display:flex;align-items:center;padding:0 10px}
.board-head>div{border:0!important;padding:0!important}
.film-row{display:flex!important;flex-direction:column;height:var(--row-h);min-height:var(--row-h);overflow:hidden;border-bottom:1px solid #304b63}
.film-row.premiere{box-shadow:inset 4px 0 #d6a660;background:#292c31}
.film-row.featured{box-shadow:inset 4px 0 #d99b54}
.film-row.multi{box-shadow:inset 3px 0 #6494c8}
.film-title{height:29px;flex:0 0 29px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:clamp(16px,1.65vw,24px);font-weight:950;line-height:1;min-width:0;overflow:hidden}
.film-title>span.movie-name{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;min-width:0;flex:1}
.film-title>span.movie-name.long{font-size:.82em}
.film-flag{display:inline-flex;flex:0 0 auto;align-items:center;padding:2px 5px;font-size:11px;font-weight:900;border-radius:3px;background:#886127;color:#fff5d4;white-space:nowrap}
.film-flag.multi{background:#254967;color:#e2f0fb}
.film-marquee{height:24px;flex:0 0 24px;min-width:0;width:100%;overflow:hidden;display:flex;align-items:center;border-top:1px solid #30495c;background:#0b1d2c}
.film-marquee-track{display:flex;align-items:center;width:max-content;white-space:nowrap;will-change:transform}
.film-marquee-set{display:flex;flex:0 0 auto;align-items:center;gap:14px;padding:0 32px 0 9px;white-space:nowrap}
.film-session{display:inline-flex;gap:3px;align-items:baseline;white-space:nowrap;font-weight:900}
.film-session .session-time{font-size:clamp(14px,1.18vw,18px);font-variant-numeric:tabular-nums;color:#edf8ff}
.film-session .session-venue{font-size:clamp(12px,1.05vw,16px);color:var(--venue)}
.film-session.blink{animation:flash 1s steps(1,end) infinite}
.film-session.blink span{color:inherit}
.film-sep{font-size:12px;color:#cfa967}
.film-list{overflow:hidden}
.board-foot{padding:5px 10px}
@media(max-width:800px){
 :root{--row-h:56px}
 .board-head{height:26px}
 .film-title{height:30px;flex-basis:30px;font-size:16px;padding:0 6px}
 .film-flag{font-size:9px}
 .film-marquee{height:25px;flex-basis:25px}
 .film-marquee-set{gap:9px;padding-right:19px}
 .film-session .session-time{font-size:14px}
 .film-session .session-venue{font-size:12px}
}
</style>
</head>
<body>
<main>
<header>
  <div><div class="eyebrow" id="venue-count">EHIME CINEMA / 5 THEATERS</div><h1>🎬 映画別 上映案内</h1></div>
  <div class="header-right"><div id="date-kind">本日のこれからの上映</div><div>映画ごとに時刻（上映館）をスクロール</div><div id="clock">--:--:--</div></div>
</header>
<section class="board" aria-label="映画作品ごとの上映時刻と映画館">
  <div class="board-head"><div class="head-film">作品名　｜　下段に上映時刻（上映館）</div></div>
  <div class="film-list" id="film-list"></div>
  <div class="board-foot"><span>開始3分前点滅・封切り初日と複数館上映を優先</span><span id="page-info">作品を確認中</span></div>
</section>
<div class="footer"><span id="data-info">上映データを確認中</span><span id="remaining">次の画面まで 30秒</span></div>
</main>
<script>
(()=>{
"use strict";
const venues=[
  {id:"shigenobu",label:"重信",color:"#94efb0"},
  {id:"masaki",label:"エミフル",color:"#ffda89"},
  {id:"kinuyama",label:"衣山",color:"#85d4ff"},
  {id:"lunatic",label:"ルナティック",color:"#dcb7fa",until:"2026-11-24"},
  {id:"imabari",label:"今治新都市",color:"#ffb09e"}
];
const JST=32400000,DURATION=30000,PAGE_MS=7500,SCROLL_SPEED=34;
const two=n=>String(n).padStart(2,"0");
const dateJst=ms=>{const d=new Date(ms+JST);return d.getUTCFullYear()+"-"+two(d.getUTCMonth()+1)+"-"+two(d.getUTCDate())};
const startMs=(date,time)=>Date.parse(date+"T"+time+":00+09:00");
const list=document.getElementById("film-list");
const clockFormat=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
let snapshot=null,updatedAt=0,groups=[],activeDate="",pageStart=performance.now(),visit=0;
let pageSize=6,displayed=-1,signature="",lastSecond=-1,tickers=[],pills=[];
function rowsPerPage(){
 const row=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h"))||54;
 return Math.max(1,Math.floor((list.clientHeight-2)/row));
}
function makeGroups(now){
 if(!snapshot)return {date:"",items:[]};
 const today=dateJst(now),tomorrow=dateJst(now+86400000),byDay=new Map([[today,[]],[tomorrow,[]]]);
 for(const v of venues)for(const show of (snapshot.theaters[v.id]?.shows||[])){
   if(!show||typeof show.title!=="string"||!show.title.trim()||
      !/^[0-9]{2}:[0-9]{2}$/.test(show.time)||!byDay.has(show.date)||
      (v.until&&show.date>v.until))continue;
   const start=startMs(show.date,show.time);
   if(start>now)byDay.get(show.date).push({title:show.title.trim(),time:show.time,start,venue:v,releaseDate:show.releaseDate||""});
 }
 const day=byDay.get(today).length?today:tomorrow,byTitle=new Map();
 for(const show of byDay.get(day)){
   if(!byTitle.has(show.title))byTitle.set(show.title,{title:show.title,first:show.start,sessions:[],seen:new Set(),releaseDates:new Set(),theaters:new Set()});
   const g=byTitle.get(show.title),key=show.venue.id+"|"+show.start;
   if(g.seen.has(key))continue;
   g.seen.add(key);g.sessions.push(show);g.theaters.add(show.venue.id);
   if(show.releaseDate)g.releaseDates.add(show.releaseDate);
   g.first=Math.min(g.first,show.start);
 }
 const items=[...byTitle.values()];
 for(const g of items){
   g.sessions.sort((a,b)=>a.start-b.start||a.venue.label.localeCompare(b.venue.label,"ja"));
   g.premiere=g.releaseDates.has(day);
   const theaters=g.theaters.size,showings=g.sessions.length;
   // This is a local exposure proxy, not an independently verified popularity ranking.
   g.popular=theaters>=3||(theaters>=2&&showings>=7);
   g.multi=theaters>=2;
   g.priority=g.premiere?0:g.popular?1:g.multi?2:3;
 }
 items.sort((a,b)=>a.priority-b.priority||a.first-b.first||a.title.localeCompare(b.title,"ja"));
 return {date:day,items};
}
function addTicker(row,group){
 const holder=document.createElement("div");holder.className="film-marquee";
 const track=document.createElement("div");track.className="film-marquee-track";
 const set=document.createElement("div");set.className="film-marquee-set";
 for(const [index,x] of group.sessions.entries()){
   if(index){const sep=document.createElement("span");sep.className="film-sep";sep.textContent="◆";set.appendChild(sep)}
   const item=document.createElement("span");item.className="film-session";item.dataset.start=String(x.start);
   item.style.setProperty("--venue",x.venue.color);
   const time=document.createElement("span");time.className="session-time";time.textContent=x.time;
   const venue=document.createElement("span");venue.className="session-venue";venue.textContent="（"+x.venue.label+"）";
   item.append(time,venue);set.appendChild(item);
 }
 track.appendChild(set);
 const copy=set.cloneNode(true);copy.setAttribute("aria-hidden","true");track.appendChild(copy);
 holder.appendChild(track);row.appendChild(holder);
 tickers.push({holder,track,set,copy,width:0,overflow:false});
 for(const p of set.querySelectorAll(".film-session"))pills.push(p);
}
function measure(){
 for(const t of tickers){
   t.width=t.set.getBoundingClientRect().width;
   t.overflow=t.width>t.holder.clientWidth;
   t.copy.style.display=t.overflow?"flex":"none";
   if(!t.overflow)t.track.style.transform="none";
 }
}
function renderPage(force=false){
 const total=Math.max(1,Math.ceil(groups.length/pageSize));
 const passed=Math.max(0,performance.now()-pageStart);
 const cycle=Math.floor(passed/DURATION),part=Math.min(3,Math.floor((passed%DURATION)/PAGE_MS));
 const page=((visit+cycle)*4+part)%total;
 if(!force&&page===displayed)return;
 displayed=page;list.replaceChildren();tickers=[];pills=[];
 if(!groups.length){
   const empty=document.createElement("div");empty.className="empty";
   empty.textContent=snapshot?"この先の上映予定はありません":"上映データを取得できませんでした";
   list.appendChild(empty);document.getElementById("page-info").textContent="上映情報なし";return;
 }
 for(const g of groups.slice(page*pageSize,(page+1)*pageSize)){
   const row=document.createElement("div");
   row.className="film-row"+(g.premiere?" premiere":g.popular?" featured":g.multi?" multi":"");
   const title=document.createElement("div");title.className="film-title";
   if(g.priority<3){
     const flag=document.createElement("span");flag.className="film-flag"+(g.priority===2?" multi":"");
     flag.textContent=g.premiere?"本日公開":g.popular?"注目上映":"複数館";
     title.appendChild(flag);
   }
   const name=document.createElement("span");name.className="movie-name"+(g.title.length>31?" long":"");
   name.textContent=g.title;name.title=g.title;title.appendChild(name);row.appendChild(title);
   addTicker(row,g);list.appendChild(row);
 }
 document.getElementById("page-info").textContent=(page+1)+" / "+total+"ページ・全"+groups.length+"作品";
 requestAnimationFrame(measure);
}
function render(){
 const now=Date.now(),next=makeGroups(now);
 const sig=JSON.stringify([next.date,next.items.map(g=>[g.title,g.priority,...g.sessions.map(x=>x.time+x.venue.id)])]);
 const size=rowsPerPage(),changed=sig!==signature||size!==pageSize;
 if(changed){groups=next.items;activeDate=next.date;signature=sig;pageSize=size;displayed=-1;}
 document.getElementById("venue-count").textContent="EHIME CINEMA / "+venues.filter(v=>!v.until||dateJst(now)<=v.until).length+" THEATERS";
 const today=dateJst(now);
 document.getElementById("date-kind").textContent=activeDate===today?"本日 "+today.slice(5).replace("-","/")+" のこれからの上映":
   activeDate?"翌日 "+activeDate.slice(5).replace("-","/")+" の上映予定":"上映情報を確認中";
 document.getElementById("data-info").textContent=updatedAt?
   "上映データ "+new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(updatedAt)+"更新／劇場公式で最終確認"
   :"上映データを確認できていません";
 renderPage(changed);
}
async function load(){
 try{
   const urls=[
     "https://raw.githubusercontent.com/ajiousama/live-wallpaper/main/transport/cinema/showtimes.json?t="+Date.now(),
     "./showtimes.json?t="+Date.now()
   ];
   let found=null;
   for(const url of urls)try{
     const response=await fetch(url,{cache:"no-store"});if(!response.ok)continue;
     const data=await response.json(),age=Date.now()-Date.parse(data.generatedAt);
     if(data.theaters&&Number.isFinite(age)&&age>=-300000&&age<18*3600000){found=data;break}
   }catch(_){}
   if(!found||!venues.every(v=>(v.until&&dateJst(Date.now())>v.until)||
      Array.isArray(found.theaters[v.id]?.shows)))throw Error("Showtime listing unavailable");
   snapshot=found;updatedAt=Date.parse(found.generatedAt);
 }catch(_){snapshot=null;updatedAt=0}
 render();
}
function tick(nowPerf){
 renderPage();
 const now=Date.now();
 for(const p of pills){const left=Number(p.dataset.start)-now;p.classList.toggle("blink",left>0&&left<=180000);}
 for(const t of tickers){
   if(!t.overflow||!t.width)continue;
   // Absolute-time phase avoids restarting a long list at every page change.
   const shift=(now/1000*SCROLL_SPEED)%t.width;
   t.track.style.transform="translate3d(-"+shift.toFixed(2)+"px,0,0)";
 }
 const elapsed=Math.max(0,nowPerf-pageStart)%DURATION;
 document.getElementById("remaining").textContent="次の画面まで "+Math.ceil((DURATION-elapsed)/1000)+"秒";
 const second=Math.floor(now/1000);
 if(second!==lastSecond){lastSecond=second;document.getElementById("clock").textContent=clockFormat.format(now);}
 requestAnimationFrame(tick);
}
window.addEventListener("message",e=>{
 if(e.origin!==location.origin||e.data?.type!=="cinema-page-active")return;
 visit++;pageStart=performance.now();displayed=-1;renderPage(true);load();
});
window.addEventListener("resize",()=>{render();requestAnimationFrame(measure)});
setInterval(load,5*60000);
setInterval(render,60000);
load();requestAnimationFrame(tick);
})();
</script></body></html>
