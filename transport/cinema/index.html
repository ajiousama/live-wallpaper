<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>映画別上映時刻｜重信・エミフルMASAKI・衣山</title>
<style>
:root{color-scheme:dark;font-family:"Yu Gothic","Meiryo",system-ui,sans-serif;--row-h:78px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111c;color:#f1f8ff}
main{height:100%;padding:clamp(7px,1.25vw,14px);display:flex;flex-direction:column;gap:8px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none;border-bottom:2px solid #d6a660;padding:1px 4px 8px}
h1{font-size:clamp(23px,2.9vw,35px);margin:0;line-height:1.08}
.eyebrow{font-size:12px;color:#aec6d9;letter-spacing:.08em}
.header-right{text-align:right;font-size:14px;color:#c8dded;line-height:1.45}
#date-kind{color:#ffe0a0;font-weight:900;font-size:16px}
#clock{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.board{min-height:0;flex:1;display:flex;flex-direction:column;border:1px solid #426078;background:#102031;border-radius:6px;overflow:hidden}
.board-head,.film-row{display:grid;grid-template-columns:minmax(285px,1.85fr) repeat(3,minmax(0,1fr));column-gap:0;min-width:0}
.board-head{height:43px;flex:none;background:#20394b;border-bottom:2px solid #64829b}
.board-head>div{display:flex;align-items:center;padding:0 12px;font-size:clamp(16px,1.65vw,21px);font-weight:1000;border-right:1px solid #365368;white-space:nowrap}
.board-head>div:last-child{border:0}
.head-film{color:#f5faff}
.head-shigenobu{color:#94efb0}
.head-masaki{color:#ffda89}
.head-kinuyama{color:#85d4ff}
.film-list{flex:1;min-height:0;overflow:hidden}
.film-row{height:var(--row-h);min-height:var(--row-h);border-bottom:1px solid #304b63;align-items:stretch;background:#102132}
.film-row:nth-child(even){background:#152a3c}
.film-title{min-width:0;display:flex;align-items:center;line-height:1.18;padding:6px 12px;font-size:clamp(17px,1.8vw,22px);font-weight:900;overflow:hidden;overflow-wrap:anywhere}
.film-title>span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.movie-times{display:flex;align-content:center;align-items:center;flex-wrap:wrap;gap:3px 5px;min-width:0;max-height:var(--row-h);overflow:hidden;padding:6px 7px;border-left:1px solid #29475b}
.showtime{flex:0 0 auto;font-size:clamp(15px,1.43vw,19px);font-weight:950;line-height:1.22;font-variant-numeric:tabular-nums;padding:2px 4px;color:#f8fcff;background:#284357;border:1px solid #53738b;border-radius:3px;white-space:nowrap}
.showtime.blink{animation:flash 1s steps(1,end) infinite}
@keyframes flash{0%,49%{background:#ffe067;color:#25200d;border-color:#ffe067}50%,100%{background:#755218;color:#fff;border-color:#b29050}}
.more{font-size:13px;font-weight:800;color:#bdcede;white-space:nowrap}
.none{font-size:16px;color:#7891a6;font-weight:800}
.empty{padding:26px 16px;text-align:center;font-size:22px;font-weight:800;color:#a8bed0}
.board-foot{flex:none;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#1a3042;border-top:1px solid #365269;padding:5px 12px;font-size:13px;color:#d1e4f5}
#page-info{color:#ffe0a0;font-weight:850;font-variant-numeric:tabular-nums}
.notices,.fees{flex:none;min-width:0}
.section-title{font-size:13px;color:#dbe8f4;font-weight:850;margin-bottom:3px}
.notice-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.notice-bar,.fee-bar{height:38px;min-width:0;overflow:hidden;background:#1a2e42;border:1px solid #3e586e;border-left:4px solid var(--accent);border-radius:3px}
.ticker-track{display:flex;align-items:center;width:max-content;height:100%;will-change:transform}
.ticker-set{display:flex;align-items:center;flex:0 0 auto;white-space:nowrap;height:100%;gap:28px;padding-right:28px}
.ticker-text{font-size:15px;font-weight:750;color:#f1f6fd}
.ticker-dot{color:#d5a967;font-size:17px}
.fee-bar{--accent:#f3ba57;background:#272f3b}
.fee-bar .ticker-text{font-size:16px}
.footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#aac6dc;font-size:12px;white-space:nowrap}
.footer #data-info{overflow:hidden;text-overflow:ellipsis}
@media(max-width:800px){
 :root{--row-h:84px}
 main{padding:6px;gap:5px}header{gap:7px;padding-bottom:4px}
 h1{font-size:19px}.eyebrow{font-size:9px}.header-right{font-size:10px}#date-kind{font-size:11px}#clock{font-size:12px}
 .board-head,.film-row{grid-template-columns:minmax(115px,1.6fr) repeat(3,minmax(0,1fr))}
 .board-head{height:32px}.board-head>div{padding:0 4px;font-size:11px}
 .film-title{font-size:12px;padding:3px 4px}.movie-times{padding:4px 3px;gap:2px}
 .showtime{font-size:11px;padding:2px}.more,.none{font-size:10px}
 .notice-bar{height:30px}.fee-bar{height:30px}.ticker-text,.fee-bar .ticker-text{font-size:11px}
 .section-title,.board-foot,.footer{font-size:10px}
}
@media(prefers-reduced-motion:reduce){.showtime.blink{animation:none;color:#ffe067}}
</style>
</head>
<body>
<main>
<header>
  <div><div class="eyebrow">MATSUYAMA CINEMA / 3 THEATERS</div><h1>🎬 映画別 上映案内</h1></div>
  <div class="header-right"><div id="date-kind">本日のこれからの上映</div><div>同じ作品の3館上映時刻を横並びで比較</div><div id="clock">--:--:--</div></div>
</header>
<section class="board" aria-label="映画作品ごとの3館上映時刻">
  <div class="board-head"><div class="head-film">作品名</div><div class="head-shigenobu">重信</div><div class="head-masaki">エミフルMASAKI</div><div class="head-kinuyama">衣山</div></div>
  <div class="film-list" id="film-list"></div>
  <div class="board-foot"><span>上映開始時刻順 ／ 開始3分前は点滅</span><span id="page-info">作品を確認中</span></div>
</section>
<section class="notices"><div class="section-title">📢 各館のお知らせ</div><div class="notice-cols" id="notice-cols"></div></section>
<section class="fees"><div class="section-title">🎫 料金案内（各館の目安）</div><div class="fee-bar" id="fee-bar"></div></section>
<div class="footer"><span id="data-info">上映データを確認中</span><span id="remaining">次の画面まで 30秒</span></div>
</main>
<script>
(()=>{"use strict";
const venues=[
 {id:"shigenobu",name:"重信",color:"#84dfa5",note:"重信｜最新の上映作品・イベント・料金は劇場公式でご確認ください"},
 {id:"masaki",name:"エミフルMASAKI",color:"#ffd180",note:"エミフルMASAKI｜最新の上映作品・イベント・料金は劇場公式でご確認ください"},
 {id:"kinuyama",name:"衣山",color:"#70c7ff",note:"衣山｜最新の上映作品・イベント・料金は劇場公式でご確認ください"}
];
const fees=["一般料金：重信 2,000円／衣山・エミフルMASAKI 2,100円","各種割引・サービスデーあり（条件は各館でご確認ください）","IMAX・4DXなど特別上映は追加料金の場合があります"];
const JST=32400000,DURATION=30000,PAGE_MS=7500,MAX_PER_THEATER=5;
const list=document.getElementById("film-list"),tickers=[];
const two=n=>String(n).padStart(2,"0");
const dateJst=ms=>{const d=new Date(ms+JST);return d.getUTCFullYear()+"-"+two(d.getUTCMonth()+1)+"-"+two(d.getUTCDate())};
const startMs=(date,time)=>Date.parse(date+"T"+time+":00+09:00");
const clockFormat=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
let snapshot=null,updatedAt=0,groups=[],activeDate="",pageStart=performance.now(),visit=0;
let pageSize=5,displayed=-1,visiblePills=[],renderSignature="",lastSecond=-1;
function marquee(host,parts){
 const track=document.createElement("div");track.className="ticker-track";
 function copy(){const el=document.createElement("div");el.className="ticker-set";
   for(const part of parts){const span=document.createElement("span");span.className="ticker-text";span.textContent=part;el.appendChild(span);
     const dot=document.createElement("span");dot.className="ticker-dot";dot.textContent="◆";el.appendChild(dot)}
   track.appendChild(el);return el}
 const first=copy();copy();host.appendChild(track);
 tickers.push({track,first,width:0,speed:0});
}
for(const v of venues){const bar=document.createElement("div");bar.className="notice-bar";bar.style.setProperty("--accent",v.color);
  marquee(bar,[v.note]);document.getElementById("notice-cols").appendChild(bar)}
marquee(document.getElementById("fee-bar"),fees);
function rowsPerPage(){
 const row=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h"))||78;
 return Math.max(1,Math.floor((list.clientHeight-2)/row));
}
function makeGroups(now){
 if(!snapshot)return {date:"",items:[]};
 const today=dateJst(now),tomorrow=dateJst(now+86400000);
 const valid=new Map();
 for(const v of venues){
   const shows=(snapshot.theaters[v.id]?.shows||[]).filter(s=>s&&typeof s.title==="string"&&s.title.trim()&&
     /^[0-9]{2}:[0-9]{2}$/.test(s.time)&&(s.date===today||s.date===tomorrow)&&startMs(s.date,s.time)>now);
   valid.set(v.id,shows);
 }
 const hasToday=venues.some(v=>valid.get(v.id).some(s=>s.date===today));
 const day=hasToday?today:tomorrow;
 const byTitle=new Map();
 for(const v of venues)for(const s of valid.get(v.id)){
   if(s.date!==day)continue;
   const title=s.title.trim(),start=startMs(s.date,s.time);
   if(!byTitle.has(title))byTitle.set(title,{title,first:start,byVenue:new Map(venues.map(x=>[x.id,[]]))});
   const g=byTitle.get(title),times=g.byVenue.get(v.id);
   if(!times.some(t=>t.start===start))times.push({time:s.time,start});
   g.first=Math.min(g.first,start);
 }
 const items=Array.from(byTitle.values()).sort((a,b)=>a.first-b.first||a.title.localeCompare(b.title,"ja"));
 for(const g of items)for(const times of g.byVenue.values())times.sort((a,b)=>a.start-b.start);
 return {date:day,items};
}
function renderPage(force=false){
 const total=Math.max(1,Math.ceil(groups.length/pageSize));
 const phase=Math.min(DURATION-1,Math.max(0,performance.now()-pageStart));
 const phasePage=Math.floor(phase/PAGE_MS);
 const page=(visit*4+phasePage)%total;
 if(!force&&page===displayed)return;
 displayed=page;list.replaceChildren();visiblePills=[];
 if(!groups.length){
   const empty=document.createElement("div");empty.className="empty";
   empty.textContent=snapshot?"この先の上映予定はありません":"上映データを取得できませんでした";
   list.appendChild(empty);
   document.getElementById("page-info").textContent="上映情報なし";
   return;
 }
 const filmGroups=groups.slice(page*pageSize,Math.min(groups.length,(page+1)*pageSize));
 for(const group of filmGroups){
   const row=document.createElement("div");row.className="film-row";
   const label=document.createElement("div");label.className="film-title";
   const title=document.createElement("span");title.textContent=group.title;title.title=group.title;label.appendChild(title);
   row.appendChild(label);
   for(const v of venues){
     const cell=document.createElement("div");cell.className="movie-times";
     const times=group.byVenue.get(v.id);
     cell.title=times.length?times.map(t=>t.time).join(" / "):"この劇場での今後の上映なし";
     if(!times.length){const none=document.createElement("span");none.className="none";none.textContent="—";cell.appendChild(none)}
     else{
       for(const t of times.slice(0,MAX_PER_THEATER)){
         const pill=document.createElement("span");pill.className="showtime";
         pill.textContent=t.time;pill.dataset.start=String(t.start);cell.appendChild(pill);visiblePills.push(pill);
       }
       if(times.length>MAX_PER_THEATER){const more=document.createElement("span");more.className="more";more.textContent="他"+(times.length-MAX_PER_THEATER)+"回";cell.appendChild(more)}
     }
     row.appendChild(cell);
   }
   list.appendChild(row);
 }
 document.getElementById("page-info").textContent=(page+1)+" / "+total+"ページ ・ 全"+groups.length+"作品";
}
function render(){
 const now=Date.now(),next=makeGroups(now);
 const signature=JSON.stringify([next.date,next.items.map(g=>[g.title,...venues.map(v=>g.byVenue.get(v.id).map(t=>t.time))])]);
 const newSize=rowsPerPage();
 const changed=renderSignature!==signature||pageSize!==newSize;
 if(changed){groups=next.items;activeDate=next.date;renderSignature=signature;pageSize=newSize;displayed=-1;}
 const today=dateJst(now);
 document.getElementById("date-kind").textContent=activeDate===today?"本日 "+today.slice(5).replace("-","/")+" のこれからの上映":
   activeDate?"翌日 "+activeDate.slice(5).replace("-","/")+" の上映予定":"上映情報を確認中";
 document.getElementById("data-info").textContent=updatedAt?
   "上映データ "+new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(updatedAt)+"更新／劇場公式で最終確認"
   :"上映データを確認できていません／料金は参考";
 renderPage(changed);
}
function measure(){
 for(const t of tickers){t.width=t.first.getBoundingClientRect().width;t.speed=t.width>0?t.width/25:0}
}
async function load(){
 try{
   const urls=["https://raw.githubusercontent.com/ajiousama/live-wallpaper/main/transport/cinema/showtimes.json?t="+Date.now(),"./showtimes.json?t="+Date.now()];
   let data=null;
   for(const url of urls)try{
     const response=await fetch(url,{cache:"no-store"});if(!response.ok)continue;
     const item=await response.json(),age=Date.now()-Date.parse(item.generatedAt);
     if(item.theaters&&Number.isFinite(age)&&age>=-300000&&age<18*3600000){data=item;break}
   }catch(_){}
   if(!data||!venues.every(v=>Array.isArray(data.theaters[v.id]?.shows)))throw Error("Cinema listing unavailable");
   snapshot=data;updatedAt=Date.parse(data.generatedAt);
 }catch(_){snapshot=null;updatedAt=0}
 render();requestAnimationFrame(measure);
}
function tick(nowPerf){
 const phase=Math.max(0,nowPerf-pageStart);
 renderPage();
 for(const p of visiblePills){const remaining=Number(p.dataset.start)-Date.now();p.classList.toggle("blink",remaining>0&&remaining<=180000)}
 for(const t of tickers){const shift=t.width>0?(phase/1000*t.speed)%t.width:0;t.track.style.transform="translateX(-"+shift.toFixed(2)+"px)"}
 const elapsed=phase%DURATION;
 document.getElementById("remaining").textContent="次の画面まで "+Math.ceil((DURATION-elapsed)/1000)+"秒";
 const second=Math.floor(Date.now()/1000);
 if(second!==lastSecond){lastSecond=second;document.getElementById("clock").textContent=clockFormat.format(Date.now())}
 requestAnimationFrame(tick);
}
window.addEventListener("message",e=>{
 if(e.origin!==location.origin||e.data?.type!=="cinema-page-active")return;
 // Retain continuity: four pages per 30-second visit; the next visit
 // begins where this one ended instead of hiding later movies forever.
 if(pageStart>0)visit++;
 pageStart=performance.now();displayed=-1;renderPage(true);load();
});
window.addEventListener("resize",()=>{render();requestAnimationFrame(measure)});
setInterval(load,5*60000);
setInterval(render,60000);
load();requestAnimationFrame(tick);
})();
</script></body></html>
