<!doctype html>
<html lang="ja" data-build="__BUILD_ID__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>松山交通総合発着案内 R15</title>
<script>
(function(){
  // This path is the actual entry point of Matsuyama_Transport_R15
  // Lively_Direct.zip. Force it onto the maintained workplace transport UI.
  var u=new URL('../freewifi/',location.href);
  var q=new URLSearchParams(location.search);
  q.forEach(function(v,k){
    if(!/^(_reload|_pc_reload|_pc_boot|boot)$/i.test(k))u.searchParams.set(k,v);
  });
  u.searchParams.set('pc','1');
  u.searchParams.set('lively','1');
  u.searchParams.set('v',document.documentElement.getAttribute('data-build')||'__BUILD_ID__');
  u.searchParams.set('_lively_entry',String(Date.now()));
  u.hash=location.hash||'';
  location.replace(u.href);
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=../freewifi/?pc=1">
</noscript>
</head>
<body>
<p><a href="../freewifi/?pc=1">松山交通総合発着案内を開く</a></p>
</body>
</html>
