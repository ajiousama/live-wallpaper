<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>JR松山駅｜独立型LED発着案内</title>
<style>
/* JR松山駅・元シミュレーターのLED 1台分（284×116）に合わせた固定座標。
   親iframe 415×142 と交通壁紙の表示領域は変更しない。
   元の表示列は 13px / 256px、1本目 y39、案内 y62、2本目 y85。 */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;
  color:#fff;font-family:'ＭＳ ゴシック','MS Gothic','Yu Gothic',Meiryo,monospace}
body{display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.board{position:relative;flex:none;width:284px;height:116px;overflow:hidden;
  background:#393939;border:1px solid #fff;color:#fff;
  transform:scale(var(--led-scale,1));transform-origin:center center}
.heading{position:absolute;top:0;left:0;right:0;height:39px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;
  text-align:center;overflow:hidden;background:#393939}
.direction{font-size:13px;font-weight:900;line-height:16px;letter-spacing:0;
  white-space:nowrap;color:#efefef}
.english-direction{font-size:10px;line-height:12px;font-weight:700;letter-spacing:.02em;
  white-space:nowrap;color:#dedede}
.clock{display:none}
.rows{position:absolute;inset:0;pointer-events:none}
.train,.ticker{position:absolute;left:13px;width:256px;height:16px;background:#000;
  overflow:hidden;outline:1px solid #222}
.rows>.train:nth-child(1){top:39px}
.rows>.train:nth-child(2){top:85px}
.train{display:grid;grid-template-columns:32px 96px 60px 68px;gap:0;
  align-items:center;margin:0;padding:0}
.kind,.service,.dep,.dest{height:16px;min-width:0;overflow:hidden;
  white-space:nowrap;display:flex;align-items:center;font-weight:900}
.kind{color:#ff3030;font-size:11px;justify-content:center;line-height:16px}
.limited .kind{background:#1e0000;color:#ff3030}
.local .kind{color:#198754}
.extra .kind,.sightseeing .kind{color:#fff06f}
.freight .kind,.pass .kind{color:#77d0de}
.service{font-size:10px;color:#ff3434;line-height:16px;letter-spacing:-.035em;padding-left:1px}
.service.pair{flex-direction:column;justify-content:center;align-items:flex-start;
  gap:0;font-size:8px;line-height:8px;letter-spacing:-.025em}
.service.pair span{display:block;width:100%;height:8px;line-height:8px;overflow:hidden;
  white-space:nowrap}
.local .service{color:#fff;font-size:10px}
/* Only a verified southbound route gets a second, visible line. */
.service.route-via{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;line-height:8px;font-size:8px}
.service.route-via .service-main,.service.route-via .via-line{display:block;height:8px;line-height:8px;white-space:nowrap}
.service.route-via .via-line{color:#f2ea28;font-size:9px}

.freight .service,.pass .service{color:#f5e15c}
.dep{font-size:13px;color:#fff;letter-spacing:-.045em;justify-content:center;
  line-height:16px}
.dest{font-size:11px;color:#f2ea28;letter-spacing:-.055em;line-height:16px;
  justify-content:center;text-align:center}
.dest.pair{flex-direction:column;justify-content:center;gap:0;font-size:8px;
  line-height:8px}
.dest.pair span{display:block;height:8px;line-height:8px}
.status{display:none!important;position:absolute;left:112px;top:0;width:128px;
  height:16px;overflow:hidden;background:#000;color:#ffed36;font-size:12px;
  font-weight:900;align-items:center;justify-content:center;z-index:3;
  white-space:nowrap}
.status.warning{display:flex!important}
.status.final{display:flex!important;left:auto;right:2px;top:0;width:42px;height:15px;background:#7b1010;color:#ffef55;font-size:10px;z-index:4}
.flash{animation:led-blink .9s steps(1,end) infinite}
@keyframes led-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.train.empty .service{color:#a0a0a0}
.train.empty .kind{color:#aaa}
.ticker{top:62px;display:grid;grid-template-columns:64px 192px;align-items:center;
  isolation:isolate}
.ticker-label{position:relative;z-index:3;font-size:12px;color:#f9ed25;
  font-weight:900;line-height:16px;white-space:nowrap;padding:0 1px;overflow:hidden}
.ticker-window{position:relative;z-index:1;width:192px;height:16px;
  overflow:hidden;clip-path:inset(0);isolation:isolate;background:#000}
.ticker-track{position:absolute;left:0;top:0;display:inline-flex;align-items:center;
  width:max-content;min-width:max-content;height:16px;white-space:nowrap;
  font-size:16px;color:#fff;line-height:16px;font-weight:900;will-change:transform;
  pointer-events:none}
.segment{display:inline-block;white-space:nowrap;padding-right:32px}
.ticker-track.is-looping{animation:jr-led-ribbon var(--ticker-loop-duration,36s) linear infinite}
.ticker-copy{display:inline-flex;align-items:center;white-space:nowrap;
  width:max-content;min-width:max-content;flex:0 0 auto;padding-right:32px}
@keyframes jr-led-ribbon{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.segment.title{color:#f33}.segment.stop{color:#ffed30}
.segment.connection{color:#64d9ff}.segment.note{color:#ddd}
.segment.station-current{color:#ffeb31;background:#51200b;animation:arrival-station-blink 1.2s steps(1,end) infinite}
@keyframes arrival-station-blink{0%,49%{color:#ffeb31;background:#51200b}50%,100%{color:#ffeb31;background:transparent}}

.ticker-note{display:none}
.arrival-alert{position:absolute;z-index:8;left:77px;top:62px;width:192px;height:16px;
  display:flex;align-items:center;justify-content:flex-start;background:#000;
  color:#fff;font-size:11px;font-weight:900;white-space:nowrap;
  letter-spacing:-.035em;overflow:hidden;isolation:isolate}
.arrival-alert[hidden]{display:none}
.arrival-alert-track{display:inline-flex;align-items:center;height:16px;
  gap:0;flex:0 0 auto;white-space:nowrap;width:max-content;will-change:transform}
.arrival-alert-track>span{display:inline-block;white-space:nowrap}
.arrival-part-soon{color:#ffe52a}
.arrival-part-service{color:#ff4b49}
.arrival-part-origin{color:#64dcff}
.arrival-part-ending{color:#f2f2f2}
/* Real LED-style discrete blink: only the caution words blink, never the
   train name, origin, background or whole board. Stable 1.4s rhythm. */
.arrival-part-soon,.arrival-part-ending{
  animation:led-approach-pulse 1.4s steps(1,end) infinite;
}
@keyframes led-approach-pulse{
  0%,69%{opacity:1}
  70%,100%{opacity:0}
}
</style>
</head>
<body>
<main class="board" aria-label="JR松山駅 発着案内LED">
 <header class="heading"><div class="direction" id="direction">八幡浜・宇和島方面 発車時刻</div><div class="english-direction" id="english-direction">for Yawatahama, Uwajima</div></header>
 <section class="rows" id="rows" aria-live="off">
   <article class="train empty"><span class="kind"></span><span class="service">列車情報取得中</span></article>
   <article class="train empty"><span class="kind"></span><span class="service">運行図を確認中</span></article>
 </section>
 <div class="ticker"><div class="ticker-label" id="ticker-label">停車駅</div><div class="ticker-window" id="ticker-window"><div class="ticker-track" id="ticker-track">停車駅・接続を確認しています</div></div></div>
 <div class="arrival-alert" id="arrival-alert" hidden><div class="arrival-alert-track" id="arrival-alert-track"></div></div>
 <span class="clock" id="clock" hidden></span>
</main>
<script>
(function(){
  'use strict';
  // Standalone display: no external image atlas, simulator JS or font dependency.
  // Parent messages retain their existing names and same-origin validation.
  // The source bitmap geometry stays at 284x116, but the full-width parent
  // reserves a 192px (public) or 216px (workplace) LED strip. Fit the REAL
  // board to the available height with a uniform scale; no parent layout
  // dimensions or train/ticker coordinates change.
  function fitOriginalLedToFrame(){
    var width=Math.max(0,window.innerWidth-20);
    var height=Math.max(0,window.innerHeight-10);
    var factor=Math.max(0.45,Math.min(width/284,height/116,2.75));
    document.documentElement.style.setProperty('--led-scale',String(factor));
  }
  fitOriginalLedToFrame();
  window.addEventListener('resize',fitOriginalLedToFrame,{passive:true});
  var direction=new URLSearchParams(location.search).get('dir')==='north'?'north':'south';
  var forcedView=new URLSearchParams(location.search).get('view')||'auto';
  var timetable={};
  var live={iso:'',at:0,departures:[],arrivals:[],scheduledArrivals:[]};
  var movements={north:{iso:'',rows:[]},south:{iso:'',rows:[]}};
  var rendered='',cycleLanguages=0,lastMinute='';
  var ticker={desiredKey:'',items:[],index:0,animation:null,currentKey:''};
  // A 15-second JR page may hide the iframe in the middle of a long route
  // ticker. Save per-corridor animation phases so both lines eventually loop
  // fully across multiple visits instead of always restarting at the front.
  var tickerPhases={south:null,north:null};
  function rememberTickerPhase(){
    if(tickerTrack?.clientWidth<1||!ticker.desiredKey)return;
    try{
      var anim=(tickerTrack.getAnimations?.()||[]).find(function(a){
        return a.animationName==='jr-led-ribbon'&&Number.isFinite(Number(a.currentTime));
      });
      if(anim)tickerPhases[direction]={key:ticker.desiredKey,time:Number(anim.currentTime)};
    }catch(e){}
  }
  var rowsEl=document.getElementById('rows');
  var tickerWindow=document.getElementById('ticker-window');
  var tickerTrack=document.getElementById('ticker-track');
  var tickerLabel=document.getElementById('ticker-label');
  var alertEl=document.getElementById('arrival-alert');
  var alertTrack=document.getElementById('arrival-alert-track');
  var approachNoticeKey='',approachScrollAnimation=null;
  var lang='ja';
  var EN_DEST={'岡山':'Okayama','高松':'Takamatsu','宇和島':'Uwajima','八幡浜':'Yawatahama',
    '今治':'Imabari','伊予北条':'Iyo-Hojo','伊予西条':'Iyo-Saijo','新居浜':'Niihama',
    '伊予市':'Iyo-shi','観音寺':'Kan-onji','伊予大洲':'Iyo-Ozu','卯之町':'Unomachi',
    '市坪':'Ichitsubo','松山':'Matsuyama','多度津':'Tadotsu'};
  function el(name,cls,txt){
    var node=document.createElement(name);
    if(cls)node.className=cls;
    if(txt!==undefined)node.textContent=String(txt);
    return node;
  }
  function timeNumber(v){
    var m=String(v||'').match(/^([01]?\d|2[0-3]):([0-5]\d)$/);
    return m?Number(m[1])*60+Number(m[2]):NaN;
  }
  // Use the parent workplace test clock only during explicit simulations.
  function ledTestClock(){
    try{
      var ctrl=window.parent.MATSUYAMA_TEST_CLOCK;
      return ctrl&&ctrl.enabled&&ctrl.hasOverride()?ctrl:null;
    }catch(e){return null;}
  }
  function ledNow(){
    var ctrl=ledTestClock();
    return ctrl?new Date(ctrl.nowMs()):new Date();
  }
  function jst(){
    var p={};
    new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',
      month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',
      hourCycle:'h23'}).formatToParts(ledNow()).forEach(function(x){p[x.type]=x.value;});
    var iso=p.year+'-'+p.month+'-'+p.day;
    return {iso:iso,minutes:Number(p.hour)*60+Number(p.minute),seconds:Number(p.second),
      dow:new Date(iso+'T12:00:00+09:00').getDay(),clock:p.hour+':'+p.minute+':'+p.second};
  }
  function available(r,n){
    return (!r.start||n.iso>=r.start)&&(!r.end||n.iso<=r.end)&&
      (!r.dates||r.dates.includes(n.iso))&&(!r.exclude||!r.exclude.includes(n.iso))&&
      (!r.days||r.days.includes(n.dow));
  }
  function depRecord(r,n){
    var t=r.timeByDow&&r.timeByDow[String(n.dow)]||r.time;
    return Object.assign({},r,{time:t});
  }
  function readMovements(n){
    if(ledTestClock())return []; // Real movements cannot be replayed as simulated movements.
    var src=movements[direction];
    if(src.iso!==n.iso)return [];
    var seen=new Set();
    return src.rows.filter(function(r){
      var t=timeNumber(r.time),num=String(r.trainNum||'');
      var key=r.kind+'|'+num+'|'+r.time;
      if(!Number.isFinite(t)||t<n.minutes||t>1440||!num||
        (r.kind!=='freight'&&r.kind!=='pass')||r.direction!==direction||seen.has(key))return false;
      seen.add(key);return true;
    }).map(function(r){
      return {id:'movement-'+r.kind+'-'+r.trainNum+'-'+r.time,time:r.time,
        kind:r.kind,service:String(r.trainNum)+(r.kind==='freight'?'レ':''),
        dest:r.kind==='freight'?'貨物列車':'通過列車',trainNum:r.trainNum,
        passStatus:r.timetableOnly?'通過予定':'通過',info:''};
    });
  }
  function ledRouteVia(row){
    if(direction!=='south'||row._arrival||row.passStatus)return '';
    var info=String(row.info||'');
    if(/伊予長浜経由|長浜経由/.test(info))return '長浜経由';
    if(/内子経由/.test(info))return '内子経由';
    return '';
  }
  function lastScheduledTrain(n){
    if(!window.MATSUYAMA_DATA?.records)return null;
    var all=window.MATSUYAMA_DATA.records.filter(function(r){
      return r.board==='rail'&&r.direction===direction&&available(r,n)&&
        ['local','limited','extra','sightseeing'].includes(r.kind);
    }).map(function(r){return depRecord(r,n);}).filter(function(r){
      return Number.isFinite(timeNumber(r.time));
    }).sort(function(a,b){return timeNumber(a.time)-timeNumber(b.time);});
    return all.length?all[all.length-1]:null;
  }
  function todayRecords(n){
    if(n.minutes<270||!Array.isArray(window.MATSUYAMA_DATA&&window.MATSUYAMA_DATA.records))return [];
    var scheduled=window.MATSUYAMA_DATA.records.filter(function(r){
      return r.board==='rail'&&r.direction===direction&&available(r,n);
    }).map(function(r){return depRecord(r,n);})
    .filter(function(r){return Number.isFinite(timeNumber(r.time))&&timeNumber(r.time)>=n.minutes;});
    var final=lastScheduledTrain(n);
    scheduled.forEach(function(r){
      r._isFinal=!!final && r.id===final.id && r.time===final.time;
    });
    return scheduled.concat(readMovements(n)).sort(function(a,b){
      return timeNumber(a.time)-timeNumber(b.time)||(a.passStatus?1:0)-(b.passStatus?1:0);
    });
  }

  // Timetable arrivals already computed by the same daily JR diagram service.
  // No guessed platforms. Never turn a simulated workplace clock into a claim
  // about present-day live positions or future arrival times.
  function todayArrivals(n){
    if(ledTestClock()||live.iso!==n.iso||
      Date.now()-live.at>90000||Date.now()-live.at< -15000)return [];
    var rows=Array.isArray(live.scheduledArrivals)?live.scheduledArrivals:[];
    return rows.filter(function(x){
      var t=timeNumber(x.arrival);
      if(x.side!==direction||!Number.isFinite(t))return false;
      var delay=x.position&&Number.isFinite(Number(x.delayMinutes))
        ?Math.max(0,Math.min(60,Number(x.delayMinutes))):0;
      return t+delay>=n.minutes && t+delay<=n.minutes+180;
    }).map(function(x){
      var num=String(x.trainNum||''),match=num.match(/^(\d+)([MD])$/i);
      var number=match?Number(match[1]):NaN;
      var suffix=match?match[2].toUpperCase():'';
      var name=x.trainClass==='limited'?'特急':'普通列車';
      if(x.trainClass==='limited' && suffix==='M' && number>=1&&number<=40)
        name='しおかぜ'+number+'号';
      else if(x.trainClass==='limited' && suffix==='D' && number>=1051&&number<=1099)
        name='宇和海'+(number-1050)+'号';
      else if(x.trainClass==='limited' && suffix==='M' &&
              [1042,1044,1046].includes(number))
        name='いしづち'+(number-940)+'号';
      else if(x.trainClass==='limited' && suffix==='M'&&number>=1000&&number<=1199)
        name='いしづち'+(number-1000)+'号';
      return {
        id:'led-arrival-'+num+'-'+x.arrival,kind:x.trainClass==='limited'?'limited':'local',
        trainNum:num,service:name,time:String(x.arrival),dest:String(x.origin||''),
        arrivalOrigin:String(x.origin||''),arrivalDestination:String(x.destination||''),
        terminating:!!x.terminating,turnback:x.turnback||null,
        position:String(x.position||''),delayMinutes:Number(x.delayMinutes)||0,
        _arrival:true
      };
    }).sort(function(a,b){
      return timeNumber(a.time)-timeNumber(b.time)||String(a.trainNum).localeCompare(String(b.trainNum));
    });
  }
  // Inbound south corridor station order. This is geographical guidance,
  // never a fabricated train position or an inferred station passage.
  // Exact station observation only. An interval such as 市坪～松山 is NOT
  // silently treated as a confirmed arrival at either station.
  function arrivalStationTrail(row){
    if(direction!=='south'||!row._arrival)return [];
    var stations=['南伊予','北伊予','市坪'];
    var origin=String(row.arrivalOrigin||'').replace(/駅$/,'');
    var start=stations.indexOf(origin);
    var trail=start>=0?stations.slice(start):stations;
    var raw=String(row.position||'').trim();
    var current=/^(南伊予|北伊予|市坪)(?:駅)?(?:付近|構内|停車中)?$/.test(raw)
      ?raw.replace(/駅|付近|構内|停車中/g,''):'';
    var parts=[{type:'stop',text:'到着方向・駅順　松山駅'}];
    trail.slice().reverse().forEach(function(station){
      parts.push({type:'stop',text:' ←←← '});
      parts.push({type:station===current?'station-current':'stop',text:station});
    });
    return parts;
  }
  function ledArrivalTickerItems(rows,n){
    if(!rows.length)return [{key:'arrivals-none',segments:[{type:'note',
      text:'当日運行図の到着情報を確認しています'}]}];
    return rows.slice(0,2).map(function(row){
      var origin=row.arrivalOrigin||'出発駅未確認';
      var seg=[];
      var trail=arrivalStationTrail(row);
      if(trail.length)seg.push.apply(seg,trail);
      seg.push({type:'title',text:row.time+'着　'+row.service+'　'+origin+'発 → 松山着'});
      if(row.terminating)seg.push({type:'note',text:'この列車は松山止まりです'});
      else if(row.arrivalDestination&&row.arrivalDestination!=='松山')
        seg.push({type:'note',text:'松山に停車後 '+row.arrivalDestination+'方面へ運転'});
      if(row.position)seg.push({type:'stop',text:'現在位置 '+row.position+
        (row.delayMinutes>0?'（'+row.delayMinutes+'分遅れ）':'')});
      if(row.terminating&&row.turnback&&
         Number.isFinite(timeNumber(row.turnback.departure))&&row.turnback.destination)
        seg.push({type:'connection',text:'折り返し候補 '+row.turnback.departure+
          '発　'+row.turnback.destination+'行（同一車両未確認）'});
      return {key:row.id,segments:seg};
    });
  }
  // Arrival attention is based on a positive train-number match in the
  // real-time location + TODAY's operating diagram, not a timetable alone.
  function activeApproach(n,number){
    if(ledTestClock()||live.iso!==n.iso||Date.now()-live.at>90000||
      Date.now()-live.at< -15000)return null;
    return live.arrivals.filter(function(x){
      if(x.side!==direction||x.confirmedApproach!==true||
         (number&&x.trainNum!==number))return false;
      var t=timeNumber(x.arrival),delay=Number(x.delayMinutes)||0;
      var seconds=(t+Math.max(0,Math.min(60,delay)))*60-n.minutes*60-n.seconds;
      return Number.isFinite(t)&&seconds>0&&seconds<=240;
    }).sort(function(a,b){
      return (timeNumber(a.arrival)+(Number(a.delayMinutes)||0))-
        (timeNumber(b.arrival)+(Number(b.delayMinutes)||0));
    })[0]||null;
  }
  function arrivalViewActive(n,arrivals){
    // A genuinely approaching train takes precedence and stays on the
    // arrival screen instead of flickering back to departures every 12 sec.
    if(activeApproach(n))return true;
    return arrivals.length>0&&Math.floor(ledNow().getTime()/12000)%2===1;
  }
  function arrivalApproachParts(approach,rows){
    var row=rows.find(function(x){return x._arrival&&x.trainNum===approach.trainNum;});
    var name=row?String(row.service||'普通列車'):'';
    if(!name){
      var train=String(approach.trainNum||'').match(/^(\d+)([MD])$/i);
      var no=train?Number(train[1]):NaN,code=train?train[2].toUpperCase():'';
      if(code==='M'&&no>=1&&no<=40)name='しおかぜ'+no+'号';
      else if(code==='D'&&no>=1051&&no<=1099)name='宇和海'+(no-1050)+'号';
      else name=approach.trainClass==='limited'?'特急 '+String(approach.trainNum||''):
        String(approach.trainNum||'')+'列車';
    }
    var origin=row?String(row.arrivalOrigin||''):'';
    return [
      {cls:'arrival-part-soon',text:'まもなく '},
      {cls:'arrival-part-service',text:name},
      {cls:'arrival-part-origin',text:origin?'（'+origin+'発）':''},
      {cls:'arrival-part-ending',text:' が到着します'}
    ];
  }
  function drawArrivalApproach(approach,rows){
    if(!approach){
      alertEl.hidden=true;
      approachNoticeKey='';
      if(approachScrollAnimation){
        approachScrollAnimation.cancel();approachScrollAnimation=null;
      }
      return;
    }
    var parts=arrivalApproachParts(approach,rows);
    var key=direction+'|'+approach.trainNum+'|'+parts.map(function(p){return p.text;}).join('|');
    alertEl.hidden=false;
    // Refreshing live data every 10 seconds never resets or flashes this line.
    if(key===approachNoticeKey)return;
    approachNoticeKey=key;
    if(approachScrollAnimation){
      approachScrollAnimation.cancel();approachScrollAnimation=null;
    }
    alertTrack.replaceChildren();
    parts.forEach(function(part){
      if(part.text)alertTrack.appendChild(el('span',part.cls,part.text));
    });
    // Short messages stay still. Longer ones move gently; yellow
    // "まもなく" and white "到着します" blink at a regular LED cadence.
    var width=alertTrack.scrollWidth,view=alertEl.clientWidth;
    if(width>view+2){
      var shift=width-view;
      var duration=Math.max(11000,Math.min(30000,Math.round(shift*1000/34)+6000));
      alertEl.style.justifyContent='flex-start';
      // Show "まもなく + train name" immediately, rather than entering
      // from an empty right edge. Pause on the beginning and the ending.
      approachScrollAnimation=alertTrack.animate([
        {transform:'translateX(0px)',offset:0},
        {transform:'translateX(0px)',offset:.16},
        {transform:'translateX(-'+shift+'px)',offset:.84},
        {transform:'translateX(-'+shift+'px)',offset:1}
      ],{duration:duration,iterations:Infinity,easing:'linear'});
    }else{
      alertTrack.style.transform='';
      alertEl.style.justifyContent='center';
    }
  }

  function splitService(row){
    var svc=String(row.service||''),info=String(row.info||'');
    var a=svc.match(/^しおかぜ(\d+)号$/),b=info.match(/いしづち(\d+)号/);
    if(a&&((b&&a[1]===b[1])||/岡山[・\/／]高松/.test(String(row.dest||'')))){
      return {pair:true,ja:['しおかぜ'+a[1]+'号','いしづち'+a[1]+'号'],
        en:['Shiokaze '+a[1],'Ishizuchi '+a[1]]};
    }
    var m=svc.match(/^宇和海(\d+)号$/);
    if(m)return {pair:false,ja:[svc],en:['Uwakai '+m[1]]};
    m=svc.match(/^しおかぜ(\d+)号$/);
    if(m)return {pair:false,ja:[svc],en:['Shiokaze '+m[1]]};
    m=svc.match(/^いしづち(\d+)号$/);
    if(m)return {pair:false,ja:[svc],en:['Ishizuchi '+m[1]]};
    if(row.kind==='local')return {pair:false,ja:['普通列車'],en:['Local Train']};
    if(row.kind==='freight')return {pair:false,ja:['貨物 '+String(row.trainNum||'')+'レ'],en:['FREIGHT '+String(row.trainNum||'')]};
    if(row.kind==='pass')return {pair:false,ja:['通過 '+String(row.trainNum||'')],en:['PASSING '+String(row.trainNum||'')]};
    if(row.kind==='sightseeing')return {pair:false,ja:[svc||'観光列車'],en:['SIGHTSEEING TRAIN']};
    return {pair:false,ja:[svc||'列車'],en:[svc||'TRAIN']};
  }
  function englishDest(s){
    return String(s||'').split(/[・／/]/).map(function(x){return EN_DEST[x.trim()]||x.trim();}).join(' / ');
  }
  function trainRow(row,n){
    var kind=row.kind||'local',pass=!!row.passStatus;
    var name=splitService(row),box=el('article','train '+kind);
    var kindJP=kind==='local'?'':pass?(kind==='freight'?'貨物':'通過'):
      ({limited:'特急',local:'普通',extra:'臨時',sightseeing:'観光',freight:'貨物',pass:'通過'}[kind]||'列車');
    var kindEN=kind==='local'?'':pass?(kind==='freight'?'Freight':'Pass'):
      ({limited:'Ltd.',local:'',extra:'Extra',sightseeing:'Tour',freight:'Frt.',pass:'Pass'}[kind]||'Train');
    box.appendChild(el('span','kind',lang==='en'?kindEN:kindJP));
    var nameEl=el('div','service'+(name.pair?' pair':''));
    (lang==='en'?name.en:name.ja).forEach(function(label){
      if(name.pair)nameEl.appendChild(el('span','',label));
      else nameEl.textContent=label;
    });
    var visibleVia=ledRouteVia(row);
    if(visibleVia&&!row._arrival){
      nameEl.classList.add('route-via');
      var mainText=nameEl.textContent||'Local Train';
      nameEl.replaceChildren(el('span','service-main',mainText),el('span','via-line',visibleVia));
    }
    box.appendChild(nameEl);
    box.appendChild(el('span','dep',String(row.time||'--:--').padStart(5,'0')));
    var dest=pass?(lang==='en'?'PASS':'通過'):
      (lang==='en'?englishDest(row.dest):String(row.dest||''));
    var destEl=el('span','dest');
    if(!pass && /岡山・高松/.test(String(row.dest||'')) && lang==='en'){
      destEl.classList.add('pair');
      ['Okayama','Takamatsu'].forEach(function(text){
        destEl.appendChild(el('span','',text));
      });
    }else if(lang==='en'&&dest==='Iyo-Saijo'){
      destEl.classList.add('pair');
      destEl.appendChild(el('span','','Iyo-'));
      destEl.appendChild(el('span','','Saijo'));
    }else destEl.textContent=dest;
    box.appendChild(destEl);
    var via=ledRouteVia(row);
    if(via)box.setAttribute('title',via);
    var dep=timeNumber(row.time),rem=dep*60-n.minutes*60-n.seconds;
    // An arrival countdown is "soon" ONLY when the live position and
    // today's diagram independently confirm this exact inbound train.
    var confirmedInbound=row._arrival&&!!activeApproach(n,row.trainNum);
    if(row._arrival&&row.position&&row.delayMinutes>0)
      rem+=Math.min(60,row.delayMinutes)*60;
    var urgent=!pass&&rem>0&&rem<=240&&(!row._arrival||confirmedInbound);
    var st=urgent?(lang==='en'?(row._arrival?'ARRIVING SOON':'DEPARTING SOON'):(row._arrival?'まもなく到着':'まもなく発車')):
      row.passStatus?(lang==='en'?'PASS SCHEDULE':row.passStatus):
      (row.kind==='limited'&&/岡山・高松/.test(String(row.dest||''))?
        (lang==='en'?'SPLITS AT UTAZU':'宇多津で分割'):'');
    var last=!!row._isFinal;
    if(!st&&last)st=lang==='en'?'LAST TRAIN':'最終';
    // Arrival rows keep the train name and origin visible at all times.
    // The separate color-coded arrival callout handles the flashing warning.
    box.appendChild(el('span','status'+(urgent&&!row._arrival?' flash warning':last?' final':''),row._arrival?'':st));
    return box;
  }
  function exactRoute(row,dest,trainNumber,n){
    if(ledTestClock())return null;
    if(live.iso!==n.iso||Date.now()-live.at>90000)return null;
    var normal=function(v){return String(v||'').trim().replace(/駅$/,'');};
    var candidates=live.departures.filter(function(v){
      return v.direction===direction&&v.trainClass===(row.kind==='limited'?'limited':'local')&&
        timeNumber(v.departure)===timeNumber(row.time)&&
        normal(v.destination)===normal(dest)&&Array.isArray(v.stops)&&v.stops.length>0&&
        normal(v.stops[v.stops.length-1].station)===normal(dest)&&
        (!trainNumber||v.trainNum===trainNumber);
    });
    if(candidates.length===0)return null;
    // Same-minute alternatives must agree exactly; no guessed station patterns.
    var unique=new Map(candidates.map(function(c){return [JSON.stringify(c.stops),c];}));
    return unique.size===1?candidates[0]:null;
  }
  function portions(row){
    var service=String(row.service||''),info=String(row.info||''),dest=String(row.dest||'');
    var pair=splitService(row);
    var name=service.match(/^しおかぜ(\d+)号$/);
    if(name){
      var out=[{name:service,destination:dest.includes('岡山')?'岡山':dest,num:String(Number(name[1]))+'M'}];
      if(pair.pair)out.push({name:'いしづち'+name[1]+'号',destination:'高松',
        num:'10'+String(Number(name[1])).padStart(2,'0')+'M'});
      return out;
    }
    var uwakai=service.match(/^宇和海(\d+)号$/);
    if(uwakai)return [{name:service,destination:dest,num:String(1050+Number(uwakai[1]))+'D'}];
    var ish=service.match(/^いしづち(\d+)号$/);
    if(ish){var no=Number(ish[1]);return [{name:service,destination:dest,num:String(no>=102&&no<=106?no+940:1000+no)+'M'}];}
    return [{name:service||'普通列車',destination:dest,num:''}];
  }
  function addPart(arr,type,text){if(text)arr.push({type:type,text:text});}
  function displayParts(row,n){
    if(!row||row.passStatus)return [{type:'note',text:'通過列車・貨物列車は旅客停車駅の案内対象外'}];
    var segments=[];
    portions(row).forEach(function(p){
      var route=exactRoute(row,p.destination,p.num,n);
      addPart(segments,'title',String(row.time)+'発　'+p.name+'　'+p.destination+'行');
      if(row._isFinal)addPart(segments,'title','最終列車');
      var via=ledRouteVia(row);
      if(via)addPart(segments,'note',via);
      if(!route){
        addPart(segments,'note','当日運行図の停車駅・時刻・接続を確認中');
        return;
      }
      var calls=route.stops.map(function(s){
        var event=s.event==='arrival'?'着':s.event==='departure'?'発':'時刻';
        return s.station+' '+s.time+event;
      });
      addPart(segments,'stop','停車駅と時刻　'+calls.join(' → '));
      var end=route.stops[route.stops.length-1];
      if(end){
        addPart(segments,'title','終点 '+end.station+' '+end.time+
          (end.event==='arrival'?'着':end.event==='departure'?'発':'（時刻表）'));
      }
      var stations=new Map(route.stops.map(function(s){return [s.station,timeNumber(s.time)];}));
      var seen=new Set();
      var transfers=(Array.isArray(route.transfers)?route.transfers:[]).filter(function(t){
        var ar=timeNumber(t.arrival),dep=timeNumber(t.departure);
        if(!stations.has(t.station)||ar!==stations.get(t.station)||t.destination==='松山'||
          !Number.isFinite(ar)||!Number.isFinite(dep)||dep<=ar||dep-ar>45||
          t.source!=='today_diagram')return false;
        var key=t.station+'|'+t.trainNum+'|'+t.departure;
        if(seen.has(key))return false;seen.add(key);return true;
      });
      if(transfers.length){
        addPart(segments,'connection','同じ駅から発車する列車（当日運行図）　'+
          transfers.slice(0,10).map(function(t){
            return t.station+' '+t.arrival+'着 → '+t.departure+'発　'+
              (t.trainNum?t.trainNum+'列車 ':'')+t.destination+'行';
          }).join(' ／ '));
      }
    });
    return segments;
  }
  function tickerItems(rows,n){
    var passengers=rows.filter(function(r){return !r.passStatus&&
      ['limited','local','extra','sightseeing'].includes(r.kind);});
    if(!passengers.length)return [{key:'empty',segments:[{type:'note',text:rows.length?
        '通過列車の案内中　旅客列車の停車駅案内はありません':
        'この方面の本日の旅客列車案内は終了しました'}]}];
    return passengers.slice(0,2).map(function(r){
      return {key:String(r.id||r.service||'')+'|'+r.time,segments:displayParts(r,n)};
    });
  }
  // Continuous two-copy LED ribbon: no empty right-edge entry, no one-shot
  // animation, and no restart when the big departure/arrival rows flip.
  function makeTickerCopies(items){
    tickerTrack.replaceChildren();
    function copy(hidden){
      var group=el('span','ticker-copy','');
      if(hidden)group.setAttribute('aria-hidden','true');
      items.forEach(function(item,i){
        item.segments.forEach(function(segment){
          group.appendChild(el('span','segment '+segment.type,segment.text));
        });
        if(i<items.length-1)group.appendChild(el('span','segment note','◆'));
      });
      return group;
    }
    tickerTrack.appendChild(copy(false));
    tickerTrack.appendChild(copy(true));
  }
  function playTickerCycle(){
    if(!ticker.items.length){
      tickerTrack.classList.remove('is-looping');
      tickerTrack.replaceChildren();
      return;
    }
    tickerTrack.classList.remove('is-looping');
    makeTickerCopies(ticker.items);
    var first=tickerTrack.firstElementChild;
    var distance=first?first.scrollWidth:0;
    // Hidden iframe may report zero. Use a conservative width estimate until
    // the containing Matsuyama screen has a real rendered box.
    if(distance<40)distance=ticker.items.reduce(function(total,item){
      return total+item.segments.reduce(function(n,part){return n+part.text.length*14;},0)+60;
    },0);
    var seconds=Math.max(10,Math.min(360,distance/45));
    tickerTrack.style.setProperty('--ticker-loop-duration',seconds.toFixed(2)+'s');
    // Reflow once on content change; NEVER on each 1-second clock heartbeat.
    void tickerTrack.offsetWidth;
    tickerTrack.classList.add('is-looping');
    var saved=tickerPhases[direction];
    if(saved&&saved.key===ticker.desiredKey){
      requestAnimationFrame(function(){
        try{
          var active=(tickerTrack.getAnimations?.()||[]).find(function(a){
            return a.animationName==='jr-led-ribbon';
          });
          if(active){
            var duration=Number(active.effect?.getComputedTiming?.().duration);
            active.currentTime=Number.isFinite(duration)&&duration>0
              ? ((saved.time%duration)+duration)%duration : saved.time;
          }
        }catch(e){}
      });
    }
  }
  tickerTrack.addEventListener('animationiteration',function(e){
    if(e.animationName!=='jr-led-ribbon'||!ticker.nextItems)return;
    ticker.items=ticker.nextItems;
    ticker.nextItems=null;
    playTickerCycle();
  });
  function syncTicker(items){
    var sig=JSON.stringify(items);
    if(sig===ticker.desiredKey)return;
    ticker.desiredKey=sig;
    var keys=items.map(function(x){return x.key;}).join('|');
    if(keys===ticker.currentKey&&tickerTrack.classList.contains('is-looping')){
      // Refresh route/transfer text on a FULL lap, not halfway through.
      ticker.nextItems=items;
      return;
    }
    ticker.currentKey=keys;
    ticker.nextItems=null;
    ticker.items=items;
    playTickerCycle();
  }
  function render(n,force){
    var arrivals=todayArrivals(n);
    var arrivalMode=forcedView==='arrival'?true:forcedView==='departure'?false:arrivalViewActive(n,arrivals);
    var rows=arrivalMode?arrivals:todayRecords(n);
    if(arrivalMode){
      var approaching=activeApproach(n);
      if(approaching){
        rows=rows.slice().sort(function(a,b){
          return Number(b.trainNum===approaching.trainNum)-
            Number(a.trainNum===approaching.trainNum) ||
            timeNumber(a.time)-timeNumber(b.time);
        });
      }
    }
    var identity=(arrivalMode?'arr':'dep')+'|'+direction+'|'+lang+'|'+rows.slice(0,2).map(function(r){
      return [r.id,r.time,r.kind,r.dest,r.info].join(':');
    }).join('|');
    if(force||identity!==rendered){
      rendered=identity;
      var fragment=document.createDocumentFragment();
      rows.slice(0,2).forEach(function(r){fragment.appendChild(trainRow(r,n));});
      while(fragment.childNodes.length<2){
        var emp=el('article','train empty');
        emp.appendChild(el('span','kind','--'));
        emp.appendChild(el('span','service',rows.length===0?
          (arrivalMode?(lang==='en'?'NO MORE ARRIVALS':'本日の到着案内は終了しました')
            :(lang==='en'?'NO MORE DEPARTURES':'本日の発車案内は終了しました')):''));
        fragment.appendChild(emp);
      }
      rowsEl.replaceChildren(fragment);
      document.getElementById('direction').textContent=
        (direction==='north'?'今治・高松・岡山方面':'八幡浜・宇和島方面')+
        (arrivalMode?' 到着時刻':' 発車時刻');
      document.getElementById('english-direction').textContent=arrivalMode
        ?(direction==='north'?'Arrivals from Imabari':'Arrivals from Uwajima')
        :(direction==='north'?'for Imabari, Takamatsu, Okayama':'for Yawatahama, Uwajima');
      tickerLabel.textContent='発着案内';
    }
    // The moving ticker is INDEPENDENT of the 12-second display-mode flash.
    // It continuously cycles both directions of information for this corridor
    // so switching the two big train rows never throws away a half-read list.
    const departuresForRibbon=todayRecords(n).slice(0,2);
    const departureRibbon=tickerItems(departuresForRibbon,n);
    const arrivalRibbon=arrivals.length?ledArrivalTickerItems(arrivals.slice(0,2),n):[];
    syncTicker(forcedView==='arrival'?arrivalRibbon:forcedView==='departure'?departureRibbon:departureRibbon.concat(arrivalRibbon));
    updateAlerts(n,rows);
  }
  function updateAlerts(n,rows){
    var alert=activeApproach(n);
    drawArrivalApproach(alert,rows);
    rows.slice(0,2).forEach(function(row,i){
      var node=rowsEl.children[i];if(!node||row.passStatus)return;
      var cell=node.querySelector('.status');if(!cell)return;
      // Never overlay the arrival train's own name/time with blinking text:
      // the yellow/white portions of the separate notice blink instead.
      if(row._arrival){
        cell.classList.remove('flash','warning');
        cell.textContent='';
        return;
      }
      var seconds=timeNumber(row.time)*60-n.minutes*60-n.seconds;
      var confirmedArrival=row._arrival&&!!activeApproach(n,row.trainNum);
      if(row._arrival&&row.position&&row.delayMinutes>0)
        seconds+=Math.min(60,row.delayMinutes)*60;
      var urgent=seconds>0&&seconds<=(row._arrival?240:60)&&
        (!row._arrival||confirmedArrival);
      var value=urgent?(lang==='en'?(row._arrival?'ARRIVING SOON':'DEPARTING SOON'):
        (row._arrival?'まもなく到着':'まもなく発車')):'';
      if(urgent){
        if(cell.textContent!==value)cell.textContent=value;
        cell.classList.add('warning');
        cell.classList.toggle('flash',!row._arrival);
      }
      else{
        cell.classList.remove('flash','warning');
        if(['まもなく発車','DEPARTING SOON','まもなく到着','ARRIVING SOON'].includes(cell.textContent))
          cell.textContent='';
      }
    });
  }
  window.addEventListener('message',function(event){
    if(event.origin!==location.origin||!event.data||typeof event.data!=='object')return;
    var d=event.data,n=jst();
    if(d.type==='matsuyama-led-direction'){
      if(d.dir!=='north'&&d.dir!=='south')return;
      if(direction!==d.dir){
        // Store the outgoing corridor's ribbon position before changing keys.
        // Otherwise a direction switch discards a partially-read long ticker.
        rememberTickerPhase();
        direction=d.dir;rendered='';render(n,true);
      }
      return;
    }
    if(d.type==='matsuyama-led-movements'){
      if(!['south','north'].includes(d.direction)||d.iso!==n.iso||
        !Array.isArray(d.movements))return;
      movements[d.direction]={iso:d.iso,rows:d.movements.slice(0,40)};
      render(n);
      return;
    }
    if(d.type==='matsuyama-led-arrivals'){
      if(d.iso!==n.iso||!Array.isArray(d.arrivals))return;
      live.iso=d.iso;live.at=Date.now();
      live.arrivals=d.arrivals.slice(0,24).filter(function(x){
        return x&&x.confirmedApproach===true&&['south','north'].includes(x.side);
      });
      live.scheduledArrivals=(Array.isArray(d.scheduledArrivals)?d.scheduledArrivals:[]).slice(0,180)
        .filter(function(x){
          return x&&['south','north'].includes(x.side)&&
            /^\d{1,5}[MD]$/i.test(String(x.trainNum||''))&&
            Number.isFinite(timeNumber(x.arrival));
        });
      live.departures=(Array.isArray(d.departures)?d.departures:[]).slice(0,170)
        .filter(function(x){
          return x&&['south','north'].includes(x.direction)&&
            ['limited','local'].includes(x.trainClass)&&Array.isArray(x.stops);
        });
      render(n);
    }
  });
  function loadSchedule(){
    var node=document.createElement('script');
    node.src='../r15-dev/schedule.js?v='+Date.now();
    node.onload=function(){render(jst(),true);node.remove();};
    node.onerror=function(){render(jst(),true);node.remove();};
    document.head.appendChild(node);
  }
  var lastLedMode='';
  function heartbeat(){
    var n=jst();
    document.getElementById('clock').textContent=n.clock;
    var minute=n.iso+'|'+n.minutes;
    var language=(Date.now()%9000)<6000?'ja':'en';
    var arrivals=todayArrivals(n);
    var mode=(forcedView==='arrival'||(forcedView!=='departure'&&arrivalViewActive(n,arrivals)))?'arrival':'departure';
    var changed=language!==lang||minute!==lastMinute||mode!==lastLedMode;
    lastLedMode=mode;
    if(changed){lang=language;lastMinute=minute;render(n,true);}
    else {
      var arrivals=todayArrivals(n);
      updateAlerts(n,arrivalViewActive(n,arrivals)?arrivals:todayRecords(n));
    }
    rememberTickerPhase();
  }
  loadSchedule();
  heartbeat();
  setInterval(heartbeat,1000);
  setInterval(loadSchedule,300000);
})();
</script>
