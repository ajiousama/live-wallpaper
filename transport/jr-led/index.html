<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JR四国 松山駅 LED電光掲示板再現</title>
<script src="../r15-dev/schedule.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0b;color:#e7e7e7;font-family:"Meiryo","Yu Gothic",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
#display{display:flex;gap:3px;width:min(96vw,1440px);align-items:stretch}
.board{width:50%;min-width:0;background:#303030;padding:0 15px 15px}
.heading{height:71px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#f0f0f0;font-weight:700;text-align:center;white-space:nowrap}
.heading .jp{font-size:clamp(11px,1.58vw,22px);letter-spacing:.04em;line-height:1.2}
.heading .en{font-size:clamp(10px,1.65vw,23px);line-height:1.25;font-family:Arial,sans-serif}
.led{position:relative;background:#070707;border:0;overflow:hidden}
.led canvas{display:block;width:100%;height:auto;image-rendering:auto}
#controls{margin-top:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;color:#aab0b4}
button{background:#242b30;border:1px solid #626b71;border-radius:4px;color:#e8ecef;font-size:13px;padding:9px 13px;cursor:pointer}
button[aria-pressed=true]{background:#39536a;border-color:#8ec7ff}
#foot{font-size:12px;color:#899198;min-height:20px;margin-top:8px}
@media(max-width:680px){#display{width:99vw;gap:1px}.board{padding:0 4px 5px}.heading{height:45px}.heading .jp{font-size:9px}.heading .en{font-size:8px}button{font-size:10px;padding:5px 6px}}
</style></head><body>
<main id="display">
  <section class="board"><div class="heading"><span class="jp">八幡浜・宇和島方面 発車時刻</span><span class="en">for Yawatahama, Uwajima</span></div><div class="led"><canvas id="south" width="668" height="185" aria-label="八幡浜・宇和島方面の発車案内"></canvas></div></section>
  <section class="board"><div class="heading"><span class="jp">今治・高松・岡山方面 発車時刻</span><span class="en">for Imabari, Takamatsu, Okayama</span></div><div class="led"><canvas id="north" width="668" height="185" aria-label="今治・高松・岡山方面の発車案内"></canvas></div></section>
</main>
<div id="controls"><button id="lang" aria-pressed="true">日本語・英語切替</button><button id="speed">速度：ふつう</button><button id="scroll">スクロール：上へ</button></div>
<div id="foot">JR松山駅｜共通時刻表使用｜列車位置未確認時は運行状況を推定しません</div>
<script>
(()=>{
'use strict';
const W=668,H=185, C={red:'#fd354a',yellow:'#fff01a',white:'#f4f4e9',green:'#63eb4d',blue:'#46dafa',amber:'#ffc300'};
const canvases={north:document.getElementById('north'),south:document.getElementById('south')};
const states={north:canvases.north.getContext('2d'),south:canvases.south.getContext('2d')};
const fclock=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'});
const mem=new Map();let english=true,speed=1,scrollUp=true;
function now(){let v={};fclock.formatToParts(new Date()).forEach(p=>v[p.type]=p.value);return {iso:v.year+'-'+v.month+'-'+v.day,dow:new Date(v.year+'-'+v.month+'-'+v.day+'T12:00:00+09:00').getDay(),min:+v.hour*60 + +v.minute}}
function mn(t){const a=/^(\d{1,2}):(\d{2})$/.exec(String(t||''));return a?+a[1]*60 + +a[2]:Infinity}
function valid(r,d){return !(r.start&&d.iso<r.start)&&!(r.end&&d.iso>r.end)&&!(Array.isArray(r.exclude)&&r.exclude.includes(d.iso))&&!(Array.isArray(r.dates)&&!r.dates.includes(d.iso))&&!(Array.isArray(r.days)&&!r.days.includes(d.dow))}
function rows(dir,d){
 if(d.min<270)return [];
 let s=window.MATSUYAMA_DATA?.records||[];
 return s.filter(r=>r.board==='rail'&&valid(r,d)&&r.direction===dir)
 .map(r=>({...r,time:r.timeByDow?.[String(d.dow)]||r.time}))
 .filter(r=>mn(r.time)>=d.min&&mn(r.time)<1440)
 .sort((a,b)=>mn(a.time)-mn(b.time));
}
function name(r){return String(r?.service||'普通')}
function dest(r){return String(r?.dest||'')}
function platform(r){return String(r?.info||'').match(/(\d+)番/)?.[1]||'－'}
function klass(r){return r?.kind==='limited'?'特急':r?.kind==='extra'?'臨時':r?.kind==='local'?'普通':r?.kind==='freight'?'貨物':'普通'}
function roman(r){
 let s=name(r);const dict={'しおかぜ':'SHIOKAZE','いしづち':'ISHIZUCHI','宇和海':'UWAKAI','伊予灘ものがたり':'IYONADA','普通':'LOCAL','特急':'EXPRESS'};
 for(const [ja,en] of Object.entries(dict))if(s.includes(ja))return s.replace(ja,en).replace('号','');
 return s;
}
function pixel(ctx,text,x,y,color,size,maxWidth,offset){
 if(!text)return;ctx.save();ctx.beginPath();ctx.rect(x,y,maxWidth,size+4);ctx.clip();
 const key=text+'|'+color+'|'+size;
 let sp=mem.get(key);if(!sp){
  const low=document.createElement('canvas');let lc=low.getContext('2d',{willReadFrequently:true});
  lc.font='bold '+Math.max(10,Math.round(size*.43))+'px Meiryo, sans-serif';let tw=Math.min(2000,Math.ceil(lc.measureText(text).width)+3);low.width=tw;low.height=Math.max(12,Math.ceil(size*.49));lc=low.getContext('2d',{willReadFrequently:true});
  lc.fillStyle='#fff';lc.font='bold '+Math.max(10,Math.round(size*.43))+'px Meiryo, sans-serif';lc.textBaseline='top';lc.fillText(text,0,-1);
  let pix=lc.getImageData(0,0,tw,low.height).data;
  sp=document.createElement('canvas');sp.width=tw*2;sp.height=low.height*2;let pc=sp.getContext('2d');pc.fillStyle=color;
  for(let yy=0;yy<low.height;yy++)for(let xx=0;xx<tw;xx++)if(pix[(yy*tw+xx)*4+3]>110){pc.beginPath();pc.arc(xx*2+1,yy*2+1,.83,0,Math.PI*2);pc.fill()}
  if(mem.size>250)mem.clear();mem.set(key,sp);
 }
 const scale=size/sp.height;const ww=sp.width*scale;
 ctx.drawImage(sp,x-(offset||0),y,ww,size);ctx.restore();
 return ww;
}
function text(ctx,s,x,y,color,size=29,w=400,seconds=0){
 const wide=pixel(ctx,s,x,y,color,size,w,0);
 if(wide>w){
  ctx.fillStyle='#070707';ctx.fillRect(x,y,w,size+2);
  const length=wide-w;const frame=seconds*speed*17;const off=frame%(length+90);pixel(ctx,s,x,y,color,size,w,Math.min(length,Math.max(0,off-45)));
 }
}
function drawRow(ctx,r,y,dir,seconds,useEn){
 const cl=klass(r);let typeColor=cl==='特急'?C.red:cl==='普通'?C.white:C.amber;
 if(!r){text(ctx,'本日の列車は終了しました',10,y+6,C.yellow,25,642,seconds);return}
 const service=useEn?roman(r):name(r);
 // Mirror the original signage: class/service on left, departure in the
 // centre, coloured destination to the right, and platform at far right.
 text(ctx,service,8,y+5,typeColor,28,275,seconds);
 text(ctx,r.time,322,y+5,C.white,29,95);
 text(ctx,dest(r),429,y+5,C.yellow,26,167,seconds);
 text(ctx,platform(r),624,y+5,C.white,29,35);
}
function ticker(ctx,seconds){
 const announcements=[
  '列車案内｜高松・岡山・新居浜・今治・伊予西条・八幡浜・宇和島方面の列車は発車時刻をご確認ください。',
  '列車案内｜指定席・自由席など詳しいご案内は駅係員へおたずねください。'
 ];
 const msg=announcements[Math.floor(seconds/18)%announcements.length];
 text(ctx,msg,5,74,C.yellow,25,658,seconds);
}
function draw(dir,sec){
 const ctx=states[dir];const d=now(),list=rows(dir,d);
 ctx.fillStyle='#080808';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#202020';ctx.fillRect(0,60,W,1);ctx.fillRect(0,122,W,1);
 if(d.min<270){
  text(ctx,'本日の発車案内は終了しました',12,12,C.yellow,28,640);
  text(ctx,'次の発車案内は4:30から',12,76,C.yellow,25,640);
  return;
 }
 const showEnglish=english&&(sec%9>6);
 drawRow(ctx,list[0],0,dir,sec,showEnglish);
 ticker(ctx,sec);
 drawRow(ctx,list[1],124,dir,sec,showEnglish);
 document.getElementById('foot').textContent=
  'JR松山駅｜'+(list.length?'発車順に時刻表表示':'本日の発車は終了しました')+
  '｜時刻表 '+(window.MATSUYAMA_DATA?.checked||'取得待ち')+'確認';
}
function render(){const sec=Date.now()/1000;draw('north',sec);draw('south',sec)}
document.getElementById('lang').onclick=function(){english=!english;this.textContent=english?'日本語・英語切替':'日本語固定';this.setAttribute('aria-pressed',String(english))};
document.getElementById('speed').onclick=function(){speed=speed===1?1.6:speed===1.6?.6:1;this.textContent='速度：'+(speed===1?'ふつう':speed===1.6?'はやく':'おそく')};
document.getElementById('scroll').onclick=function(){scrollUp=!scrollUp;this.textContent='スクロール：'+(scrollUp?'上へ':'下へ')};
render();setInterval(render,150);
})();
</script></body></html>
