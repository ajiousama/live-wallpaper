<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>松山空港 ロゴ確認版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#06131b;color:#eef8ff;font-family:"Yu Gothic UI","Meiryo",sans-serif}
main{max-width:1280px;margin:auto;padding:24px}
h1{margin:0 0 8px;font-size:30px}p{margin:0 0 22px;color:#a8bec9}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:grid;grid-template-columns:230px 1fr;align-items:center;min-height:100px;padding:14px;border:1px solid #29444f;background:#0a1d26}
.logo{height:66px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:3px;padding:7px 12px;overflow:hidden}
.logo img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.name{font-size:20px;font-weight:900;margin-left:18px}.src{margin:4px 0 0 18px;font-size:12px;color:#91aab5}
.note{margin-top:20px;padding:12px 14px;border:1px solid #365563;background:#081a22;color:#b8cbd4}
@media(max-width:760px){.grid{grid-template-columns:1fr}.card{grid-template-columns:180px 1fr}.logo{height:58px}}
</style>
</head>
<body><main>
<h1>松山空港 航空会社ロゴ・鮮明版</h1>
<p>形は変更せず、SVGまたは高解像度素材へ差し替えた確認用。JALは現在の鶴丸ロゴを維持。</p>
<div class="grid">
  <div class="card"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/8/8d/All_Nippon_Airways_Logo.svg" alt="ANA"></div><div><div class="name">ANA</div><div class="src">SVG</div></div></div>
  <div class="card"><div class="logo"><img src="https://www.matsuyama-airport.co.jp/img/logo/JAL.png" alt="JAL"></div><div><div class="name">JAL</div><div class="src">松山空港掲載の現行鶴丸ロゴ</div></div></div>
  <div class="card"><div class="logo"><img src="https://newscast.jp/attachments/GGxKzaX071Sa4bUQShUJ.png" alt="IBEX"></div><div><div class="name">IBEX</div><div class="src">高解像度</div></div></div>
  <div class="card"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/Jetstar_logo.svg" alt="Jetstar"></div><div><div class="name">Jetstar</div><div class="src">SVG</div></div></div>
  <div class="card"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Jeju_Air_Logo.svg" alt="Jeju Air"></div><div><div class="name">Jeju Air</div><div class="src">SVG</div></div></div>
  <div class="card"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Air_Busan_logo.svg" alt="Air Busan"></div><div><div class="name">Air Busan</div><div class="src">SVG</div></div></div>
  <div class="card"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/7/74/Asiana_Airlines.svg" alt="Asiana Airlines"></div><div><div class="name">Asiana Airlines</div><div class="src">SVG・コードシェア用</div></div></div>
  <div class="card"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/c/cf/Logo_EVA_Air.svg" alt="EVA Air"></div><div><div class="name">EVA Air</div><div class="src">SVG</div></div></div>
</div>
<div class="note">このページはロゴ確認用だけ。会社PC本番の空港画面にはまだ反映していません。</div>
</main></body></html>
