<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="color-scheme" content="dark">
<title>週末ギャンブル結果一覧</title>
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<main id="dash">
  <header class="topbar">
    <h1>週末ギャンブル</h1>
    <div class="status">
      <div class="live"><span></span>自動</div>
      <div id="updated">--:--:--</div>
      <div id="clock">--:--</div>
    </div>
  </header>

  <section class="main-grid">
    <section class="left-column">
      <section class="block keirin-block sport-panel active">
        <div class="block-head"><h2>競輪 <span id="keirin-phase">本日開催全場</span></h2></div>
        <div id="keirin-grid" class="two-grid"></div>
      </section>

      <section class="block boat-block sport-panel">
        <div class="block-head"><h2>ボート 全開催場</h2></div>
        <div id="boat-grid" class="two-grid"></div>
      </section>
    </section>

    <section class="right-column block">
      <div class="block-head right-head"><h2 id="right-title">競馬 全開催場</h2></div>
      <div id="right-grid" class="right-grid"></div>
    </section>
  </section>

  <footer><span id="source"></span></footer>
</main>
<script src="app.js?v=20"></script>
</body>
</html>
