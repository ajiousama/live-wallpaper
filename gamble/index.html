<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="color-scheme" content="dark">
<title>本日ギャンブル</title>
<link rel="stylesheet" href="style.css?v=26">
</head>
<body>
<main id="dash">
  <header class="topbar">
    <div class="screen-heading">
      <strong id="screen-title">モーニング</strong>
      <span id="screen-sub">本日開催</span>
    </div>
    <div class="status">
      <span class="live"><i></i>自動</span>
      <span id="updated">--:--:--</span>
      <span id="clock">--:--</span>
    </div>
  </header>

  <section id="phase-screen" class="screen active">
    <div id="phase-grid" class="phase-grid sport-grid-vscroll"></div>
  </section>

  <section id="jra-screen" class="screen">
    <div id="jra-grid" class="jra-dedicated-grid"></div>
  </section>
</main>
<script src="app.js?v=26"></script>
</body>
</html>
